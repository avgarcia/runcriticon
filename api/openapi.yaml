openapi: 3.0.3
info:
  title: Runcriticon API
  version: 0.1.0
  description: API REST de Runcriticon
servers:
  - url: /api
    description: Mismo origen que la SPA (cookie de sesión first-party, sin CORS)

tags:
  - name: entrenadores
    description: Alta y listado de entrenadores del club
  - name: alumnos
    description: Alta y reinvitación de alumnos del club
  - name: usuarios
    description: Acciones administrativas sobre cuentas de usuario (revocar sesiones, desactivar)
  - name: sesion
    description: Inicio, consulta y cierre de sesión, magic link y reseteo de contraseña
  - name: activacion
    description: Activación de cuentas invitadas
  - name: me
    description: Datos del propio usuario autenticado
  - name: club
    description: Ficha del club
  - name: taxonomia
    description: Ejes (tags) y valores con los que el club clasifica a sus alumnos

security:
  - cookieAuth: []

paths:
  /entrenadores:
    get:
      summary: Listar los entrenadores del club (solo admin)
      description: |
        Devuelve todos los entrenadores del club del principal con su estado de cuenta
        (INVITADO, ACTIVO, DESACTIVADO). Solo el ADMIN puede consultarlo.
      operationId: listarEntrenadores
      tags: [entrenadores]
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Dar de alta un entrenador por invitación
      description: |
        Crea un entrenador en estado INVITADO y le envía por email el enlace de activación (token de
        un solo uso). Solo el ADMIN. Rechaza el alta con 409 si ya existe un usuario con ese email en
        el club.
      operationId: invitarEntrenador
      tags: [entrenadores]
      requestBody:
        $ref: '#/components/requestBodies/InviteCoachBody'
      responses:
        '201':
          $ref: '#/components/responses/EntrenadorCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /entrenadores/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el entrenador (invalida la anterior)
      description: |
        Emite una invitación nueva para un entrenador que sigue pendiente de activar, invalida la
        anterior y reenvía el email. Solo el ADMIN. Devuelve 404 si el usuario no existe o no es
        entrenador, y 409 si ya está activo.
      operationId: reinvitarEntrenador
      tags: [entrenadores]
      parameters:
        - $ref: '#/components/parameters/EntrenadorId'
      responses:
        '204':
          $ref: '#/components/responses/InvitacionReemitida'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /usuarios/{id}/revocacion-sesiones:
    post:
      summary: Revocar todas las sesiones activas de un usuario (logout forzado por admin)
      description: |
        Cierra de forma inmediata todas las sesiones activas del usuario (logout forzado). Solo el
        ADMIN. Devuelve 404 si el usuario no pertenece al club del principal.
      operationId: revocarSesionesUsuario
      tags: [usuarios]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          $ref: '#/components/responses/SesionesRevocadas'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /usuarios/{id}/desactivacion:
    post:
      summary: Desactivar la cuenta de un usuario y cerrar sus sesiones (admin)
      description: |
        Desactiva la cuenta del usuario y revoca sus sesiones activas al instante. Solo el ADMIN.
        Devuelve 404 si el usuario no pertenece al club, y 409 si la cuenta ya estaba desactivada.
      operationId: desactivarUsuario
      tags: [usuarios]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          $ref: '#/components/responses/CuentaDesactivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos:
    post:
      summary: Dar de alta un alumno por invitación
      description: |
        Crea un alumno en estado INVITADO y le envía por email el enlace de activación. Lo pueden
        ejecutar el ADMIN y el ENTRENADOR (delegación). Rechaza el alta con 409 si ya existe un
        usuario con ese email en el club.
      operationId: invitarAlumno
      tags: [alumnos]
      requestBody:
        $ref: '#/components/requestBodies/InviteStudentBody'
      responses:
        '201':
          $ref: '#/components/responses/AlumnoCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el alumno (invalida la anterior)
      description: |
        Emite una invitación nueva para un alumno que sigue pendiente de activar, invalida la anterior
        y reenvía el email. ADMIN o ENTRENADOR (delegación). Devuelve 404 si el usuario no existe o no
        es alumno, y 409 si ya está activo.
      operationId: reinvitarAlumno
      tags: [alumnos]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
      responses:
        '204':
          $ref: '#/components/responses/InvitacionReemitida'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /activacion:
    post:
      summary: Activar la cuenta fijando contraseña con el token de invitación
      description: |
        Activa una cuenta invitada fijando su contraseña con el token del email (un solo uso) y, al
        lograrlo, inicia sesión (auto-login, cookie httpOnly). Endpoint anónimo. Devuelve 400/404 si
        el token es inválido o caducado, y 409 si la cuenta ya está activa.
      operationId: activarCuenta
      tags: [activacion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/ActivationBody'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion:
    post:
      summary: Iniciar sesión con email y contraseña
      description: |
        Autentica con email y contraseña y abre sesión (cookie httpOnly). El fallo de credenciales es
        401 neutro (no distingue email inexistente de contraseña incorrecta); tras varios fallos
        aplica backoff progresivo con 429 y cabecera Retry-After. Una contraseña caducada devuelve 409
        con code=PASSWORD_EXPIRED sin crear sesión.
      operationId: iniciarSesion
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CredentialsBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ContrasenaCaducada'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/actual:
    get:
      summary: Consultar la sesión en curso
      description: |
        Devuelve el principal de la sesión en curso (userId, clubId y rol). Requiere una sesión
        activa; sin cookie válida responde 401.
      operationId: consultarSesion
      tags: [sesion]
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/cierre:
    post:
      summary: Cerrar la sesión en curso
      description: |
        Cierra la sesión en curso e invalida la cookie de sesión. Requiere una sesión activa.
      operationId: cerrarSesion
      tags: [sesion]
      responses:
        '204':
          $ref: '#/components/responses/SesionCerrada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/contrasena:
    post:
      summary: Fijar una contraseña nueva cuando la actual ha caducado
      description: |
        Fija una contraseña nueva cuando la actual ha caducado: revalida con la contraseña caducada y,
        al lograrlo, inicia sesión (cookie httpOnly). Es el paso siguiente al 409 PASSWORD_EXPIRED del
        login. Devuelve 401 si la contraseña actual no es válida y 409 si no estaba caducada.
      operationId: cambiarContrasenaCaducada
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/magic-link:
    post:
      summary: Solicitar un magic link de login
      description: |
        Solicita un enlace mágico de acceso para el email indicado. Responde siempre 202 neutro,
        exista o no la cuenta, para no revelar si un email está registrado. Si el email corresponde a
        una cuenta activa, se envía el enlace por email.
      operationId: solicitarMagicLink
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkBody'
      responses:
        '202':
          $ref: '#/components/responses/MagicLinkSolicitado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/magic-link/consumo:
    post:
      summary: Consumir un magic link e iniciar sesión
      description: |
        Consume el token del enlace mágico e inicia sesión (cookie httpOnly). El token es de un solo
        uso y caduca a los 15 min; uno inválido o caducado devuelve 400/404.
      operationId: consumirMagicLink
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/reseteo:
    post:
      summary: Solicitar un reseteo de contraseña por magic link
      description: |
        Solicita un enlace de reseteo de contraseña para el email indicado. Responde siempre 202
        neutro, exista o no la cuenta, para no revelar si un email está registrado. Si el email
        corresponde a una cuenta activa, se envía el enlace por email.
      operationId: solicitarReseteo
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetBody'
      responses:
        '202':
          $ref: '#/components/responses/ReseteoSolicitado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/reseteo/consumo:
    post:
      summary: Consumir un reseteo de contraseña, fijar la nueva e iniciar sesión
      description: |
        Consume el token de reseteo (un solo uso, 15 min), fija la contraseña nueva, invalida todas
        las sesiones activas del usuario e inicia sesión. Un token inválido o caducado devuelve
        400/404.
      operationId: consumirReseteo
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /club:
    get:
      summary: Consultar la ficha del propio club
      description: |
        Devuelve la ficha del club del principal (nombre, slug). Cualquier rol autenticado puede
        consultarla — no hay regla RBAC distinta por rol.
      operationId: consultarClub
      tags: [club]
      responses:
        '200':
          $ref: '#/components/responses/ClubActual'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    patch:
      summary: Cambiar el nombre del club
      description: |
        Cambia el nombre del club del principal. Solo el ADMIN. `nombre` es el único campo editable
        del MVP y va como `required` en el cuerpo para evitar la ambigüedad ausente-vs-null propia de
        PATCH.
      operationId: actualizarClub
      tags: [club]
      requestBody:
        $ref: '#/components/requestBodies/ClubPatchBody'
      responses:
        '200':
          $ref: '#/components/responses/ClubActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/permissions:
    get:
      summary: Consultar los propios permisos
      description: |
        Mapa `{ recurso: [acciones] }` calculado server-side desde la matriz de autorización para el
        rol del usuario actual. Es ayuda de UX para ocultar botones — nunca una barrera: cada
        petición real se autoriza en el servidor con independencia de lo que este endpoint devuelva.
      operationId: consultarMisPermisos
      tags: [me]
      responses:
        '200':
          $ref: '#/components/responses/MisPermisos'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia:
    get:
      summary: Consultar la taxonomía del club
      description: |
        Devuelve la taxonomía completa del club del principal: todos sus ejes con sus valores,
        **incluidos los archivados** — `archivadoEn` distingue unos de otros, y el editor los
        muestra atenuados con opción de reactivarlos. La consultan el ADMIN y el ENTRENADOR; el
        ALUMNO no. No se pagina: el dimensionado previsto es de decenas de ejes y cientos de
        valores, una sola pantalla.
      operationId: consultarTaxonomia
      tags: [taxonomia]
      responses:
        '200':
          $ref: '#/components/responses/TaxonomiaActual'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags:
    post:
      summary: Crear un eje de la taxonomía
      description: |
        Crea un eje nuevo. Solo el ADMIN. El nombre se guarda tal y como se teclea, pero la
        unicidad se comprueba ignorando mayúsculas, acentos y espacios de los extremos, y solo
        contra los ejes **activos**: un nombre archivado se puede reutilizar.
      operationId: crearTag
      tags: [taxonomia]
      requestBody:
        $ref: '#/components/requestBodies/TagKeyLabelBody'
      responses:
        '201':
          $ref: '#/components/responses/TagCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}:
    patch:
      summary: Renombrar un eje de la taxonomía
      description: |
        Cambia el nombre del eje. Solo el ADMIN. `nombre` va como `required` en el cuerpo para
        evitar la ambigüedad ausente-vs-null propia de PATCH. Renombrar un eje archivado se permite
        y no compite por la unicidad.
      operationId: renombrarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        $ref: '#/components/requestBodies/TagKeyLabelBody'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}/archivado:
    post:
      summary: Archivar un eje de la taxonomía
      description: |
        Archiva el eje (soft-delete): deja de ofrecerse para clasificar, pero ni él ni las
        asignaciones existentes se borran. Sin cascada — sus valores conservan su propio
        `archivadoEn`. Solo el ADMIN. Idempotente: re-archivar mantiene la marca original.

        `archivado` es un sub-recurso de **estado**: se crea con POST y se retira con DELETE.
      operationId: archivarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Reactivar un eje archivado
      description: |
        Retira la marca de archivado. Solo el ADMIN. Idempotente sobre un eje ya activo. Devuelve
        409 si, mientras estaba archivado, se creó otro eje activo con el mismo nombre normalizado.
        No reactiva sus valores: cada uno conserva su propio `archivadoEn`.
      operationId: reactivarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}/valores:
    post:
      summary: Añadir un valor a un eje
      description: |
        Crea un valor dentro del eje. Solo el ADMIN. La unicidad es **dentro del eje**, no del club:
        el mismo valor puede existir en dos ejes distintos. Devuelve 409 si el eje está archivado.

        El valor nace sin metadata; asignar metadata de carrera (fecha y distancia) llegará con su
        propia operación.
      operationId: crearValorTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        $ref: '#/components/requestBodies/TagValueLabelBody'
      responses:
        '201':
          $ref: '#/components/responses/ValorCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/valores/{valorId}:
    patch:
      summary: Renombrar un valor de la taxonomía
      description: |
        Cambia el literal del valor. Solo el ADMIN. Afecta a todos los alumnos que lo tuvieran
        asignado — no se duplica ni se crea uno nuevo. No cuelga de `{tagId}` porque el id del valor
        es único en toda la taxonomía del club.
      operationId: renombrarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      requestBody:
        $ref: '#/components/requestBodies/TagValueLabelBody'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/valores/{valorId}/archivado:
    post:
      summary: Archivar un valor de la taxonomía
      description: |
        Archiva el valor (soft-delete). Las asignaciones existentes se conservan; el valor deja de
        ofrecerse para nuevas y libera su literal dentro del eje. Solo el ADMIN. Idempotente.
      operationId: archivarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Reactivar un valor archivado
      description: |
        Retira la marca de archivado del valor. Solo el ADMIN. Se permite **aunque su eje siga
        archivado** —el archivado no tiene cascada—, pero mientras el eje lo esté el valor no se
        ofrece para asignar. Devuelve 409 si su literal fue reocupado por otro valor activo del
        mismo eje.
      operationId: reactivarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Sesión autenticada por cookie httpOnly first-party (Spring Session). El navegador la adjunta
        automáticamente; el cliente nunca la lee ni la envía a mano. Los endpoints de entrada anónima
        (login, activación, magic link, reseteo) no la requieren (security: []).

  headers:
    RetryAfter:
      description: Segundos recomendados antes de reintentar
      schema:
        type: integer

  parameters:
    EntrenadorId:
      name: id
      in: path
      required: true
      description: ID del entrenador
      schema:
        type: string
        format: uuid

    AlumnoId:
      name: id
      in: path
      required: true
      description: ID del alumno
      schema:
        type: string
        format: uuid

    UsuarioId:
      name: id
      in: path
      required: true
      description: ID del usuario
      schema:
        type: string
        format: uuid

    TagId:
      name: tagId
      in: path
      required: true
      description: ID del eje de la taxonomía
      schema:
        type: string
        format: uuid

    ValorTagId:
      name: valorId
      in: path
      required: true
      description: ID del valor de la taxonomía (único en todo el club, no solo dentro de su eje)
      schema:
        type: string
        format: uuid

  requestBodies:
    InviteCoachBody:
      description: Datos necesarios para dar de alta un entrenador
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachRequest'

    InviteStudentBody:
      description: Datos necesarios para dar de alta un alumno
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentRequest'

    ActivationBody:
      description: Token de invitación y contraseña elegida
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationRequest'

    CredentialsBody:
      description: Email y contraseña para iniciar sesión
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialsRequest'

    PasswordChangeBody:
      description: Email, contraseña caducada y contraseña nueva (cambio forzado)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeRequest'

    MagicLinkBody:
      description: Email para el que se solicita el magic link
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkRequest'

    MagicLinkConsumeBody:
      description: Token del magic link a consumir
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkConsumeRequest'

    PasswordResetBody:
      description: Email para el que se solicita el reseteo de contraseña
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'

    PasswordResetConsumeBody:
      description: Token del reseteo y contraseña nueva
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetConsumeRequest'

    ClubPatchBody:
      description: Nombre nuevo del club
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubPatchRequest'

    TagKeyLabelBody:
      description: |
        Nombre del eje. El alta y el renombrado comparten cuerpo porque la forma y la semántica son
        idénticas; duplicar el esquema solo por el verbo sería ruido.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyLabelRequest'

    TagValueLabelBody:
      description: Literal del valor, para crearlo o renombrarlo dentro de su eje
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueLabelRequest'

  responses:
    EntrenadorCreado:
      description: Entrenador creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachResponse'

    EntrenadoresListados:
      description: Lista de entrenadores del club
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CoachSummary'

    AlumnoCreado:
      description: Alumno creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentResponse'

    CuentaActivada:
      description: Cuenta activada; sesión iniciada (cookie httpOnly)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationResponse'

    SesionIniciada:
      description: Sesión iniciada; cookie de sesión httpOnly establecida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'

    InvitacionReemitida:
      description: Nueva invitación emitida; la anterior queda invalidada

    SesionesRevocadas:
      description: Sesiones del usuario revocadas

    CuentaDesactivada:
      description: Cuenta desactivada; sus sesiones activas quedan revocadas

    SesionCerrada:
      description: Sesión cerrada

    ContrasenaCaducada:
      description: |
        Contraseña caducada. Cuerpo ErrorResponse con `code=PASSWORD_EXPIRED`; no se crea sesión.
        El cliente debe llevar al cambio obligatorio (POST /sesion/contrasena).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PASSWORD_EXPIRED
            message: La contraseña ha caducado

    MagicLinkSolicitado:
      description: |
        Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace. Respuesta
        neutra: idéntica exista o no la cuenta, para no revelar si un email está registrado.

    ReseteoSolicitado:
      description: |
        Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace para
        restablecer la contraseña. Respuesta neutra: idéntica exista o no la cuenta, para no
        revelar si un email está registrado.

    MisPermisos:
      description: Permisos concedidos al rol del principal actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionsResponse'

    ClubActual:
      description: Ficha del club
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubResponse'

    ErrorBadRequest:
      description: Entrada inválida (campo requerido vacío, formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_INPUT
            field: email
            message: El email no tiene un formato válido

    ErrorUnauthorized:
      description: No autenticado; la sesión ha expirado o no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: No autenticado

    ErrorForbidden:
      description: El principal no tiene permiso (cuerpo neutro sin detalles)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Acceso denegado

    ErrorNotFound:
      description: Recurso no encontrado o no pertenece al club del principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado

    ErrorConflict:
      description: La operación choca con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CONFLICT
            message: Ya existe un usuario con ese email en el club

    ErrorTooManyRequests:
      description: |
        Límite de rate-limiting alcanzado. Cuerpo ErrorResponse con `code=RATE_LIMITED` y cabecera
        `Retry-After` (segundos). Los flujos anónimos de magic link y reseteo NO devuelven 429:
        mantienen su 202 neutro para no revelar que se alcanzó un límite.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Has superado el límite de peticiones; inténtalo de nuevo más tarde

    ErrorServerError:
      description: |
        Error interno del servidor (red de seguridad de GlobalRestExceptionHandler). Cuerpo
        ErrorResponse con `code=INTERNAL_ERROR` y mensaje neutro: el detalle del fallo va al log,
        nunca al body. Puede devolverlo cualquier endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Ha ocurrido un error inesperado

    TaxonomiaActual:
      description: Taxonomía completa del club, con sus ejes archivados incluidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaxonomyResponse'

    TagCreado:
      description: Eje creado en la taxonomía del club
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyResponse'

    TagActual:
      description: Estado del eje después de la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyResponse'

    ValorCreado:
      description: Valor creado dentro del eje
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueResponse'

    ValorActual:
      description: Estado del valor después de la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueResponse'

  schemas:
    InviteCoachRequest:
      type: object
      description: Datos necesarios para dar de alta un entrenador por invitación
      required: [nombre, email]
      properties:
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'

    InviteCoachResponse:
      type: object
      description: Respuesta al alta del entrenador
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b

    CoachSummary:
      type: object
      description: Vista de lectura de un entrenador para el listado admin
      required: [id, nombre, email, estado]
      properties:
        id:
          type: string
          format: uuid
          description: ID del entrenador
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'
        estado:
          type: string
          enum: [INVITADO, ACTIVO, DESACTIVADO]
          description: Estado de la cuenta
          example: ACTIVO

    InviteStudentRequest:
      type: object
      description: Datos necesarios para dar de alta un alumno por invitación
      required: [nombre, email]
      properties:
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'

    InviteStudentResponse:
      type: object
      description: Respuesta al alta del alumno
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b

    Email:
      type: string
      format: email
      maxLength: 254
      description: Dirección de email del usuario (identificador único dentro del club)
      example: usuario@club.es

    Nombre:
      type: string
      minLength: 1
      maxLength: 200
      description: Nombre completo de la persona
      example: Ana García

    NombreClub:
      type: string
      minLength: 1
      maxLength: 200
      description: Nombre del club
      example: Club Atletismo Central

    Token:
      type: string
      minLength: 1
      maxLength: 512
      description: Token de un solo uso recibido por email (invitación, magic link o reseteo)
      example: 8Kq2mZ7pR4tV9wX1yB6nC3dF5gH0jL

    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: Contraseña nueva; política de contraseña (12–128 caracteres, sin datos personales, no reutilizada)

    ActivationRequest:
      type: object
      description: Datos para activar la cuenta por invitación
      required: [token, password]
      properties:
        token:
          $ref: '#/components/schemas/Token'
        password:
          $ref: '#/components/schemas/Password'

    ActivationResponse:
      description: Sesión iniciada tras la activación (mismo shape que la sesión de login)
      allOf:
        - $ref: '#/components/schemas/SessionResponse'

    CredentialsRequest:
      type: object
      description: Credenciales de login con contraseña
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          description: Contraseña en claro (se verifica contra el hash Argon2id)
          minLength: 1
          maxLength: 128

    SessionResponse:
      type: object
      description: Sesión iniciada; nunca incluye datos sensibles ni el hash de la contraseña
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        clubId:
          type: string
          format: uuid
          example: 018f9a2b-9f8e-7d6c-b5a4-3210fedcba98
        role:
          type: string
          enum: [ADMIN, ENTRENADOR, ALUMNO]
          description: Rol del usuario
          example: ENTRENADOR

    PermissionsResponse:
      type: object
      description: |
        Mapa `{ recurso: [acciones] }`. Las claves son los recursos protegidos por la matriz (COACH,
        STUDENT, USER, CLUB, TAXONOMY); cada valor es la lista de acciones concedidas al rol del
        principal actual sobre ese recurso. Un recurso sin acciones concedidas no aparece en el mapa.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        COACH: [INVITE, LIST]
        STUDENT: [INVITE]
        USER: [REVOKE_SESSIONS, DEACTIVATE]
        CLUB: [UPDATE]
        TAXONOMY: [MANAGE, LIST]

    ClubResponse:
      type: object
      description: Ficha del club
      required: [id, nombre]
      properties:
        id:
          type: string
          format: uuid
          example: 018f9a2b-9f8e-7d6c-b5a4-3210fedcba98
        nombre:
          $ref: '#/components/schemas/NombreClub'
        slug:
          type: string
          nullable: true
          description: |
            Identificador corto de solo lectura; aún sin uso (el enrutado por subdominio es multi-club).
            En el MVP siempre llega vacío: ningún club tiene slug asignado todavía.
          example: club-atletismo-central

    ClubPatchRequest:
      type: object
      description: Datos editables de la ficha del club. En el MVP, solo el nombre.
      required: [nombre]
      properties:
        nombre:
          $ref: '#/components/schemas/NombreClub'

    PasswordChangeRequest:
      type: object
      description: |
        Cambio forzado de contraseña caducada. Revalida la contraseña actual (la caducada que el
        usuario tecleó) y fija la nueva; al lograrlo, inicia sesión.
      required: [email, currentPassword, newPassword]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        currentPassword:
          type: string
          format: password
          description: Contraseña actual (caducada) para revalidar la identidad
          minLength: 1
          maxLength: 128
        newPassword:
          $ref: '#/components/schemas/Password'

    MagicLinkRequest:
      type: object
      description: Email para el que se solicita un magic link de login
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    MagicLinkConsumeRequest:
      type: object
      description: Token del magic link recibido en el email (un solo uso, 15 min)
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/Token'

    PasswordResetRequest:
      type: object
      description: Email para el que se solicita un reseteo de contraseña
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    PasswordResetConsumeRequest:
      type: object
      description: |
        Token del reseteo recibido en el email (un solo uso, 15 min) y contraseña nueva. Al fijarla,
        el backend invalida todas las sesiones activas del usuario e inicia sesión.
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/Token'
        newPassword:
          $ref: '#/components/schemas/Password'

    TaxonomyResponse:
      type: object
      description: Taxonomía del club — el conjunto de sus ejes, cada uno con sus valores
      required: [tags]
      properties:
        tags:
          type: array
          description: Ejes de la taxonomía, activos y archivados, en orden de alta
          items:
            $ref: '#/components/schemas/TagKeyResponse'

    TagKeyResponse:
      type: object
      description: Eje de la taxonomía (nivel, objetivo, terreno…) con sus valores
      required: [id, nombre, valores]
      properties:
        id:
          type: string
          format: uuid
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        nombre:
          $ref: '#/components/schemas/TagKeyLabel'
        archivadoEn:
          type: string
          format: date-time
          nullable: true
          description: Momento del archivado; `null` si el eje está activo
          example: '2026-07-28T10:15:30Z'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueResponse'

    TagValueResponse:
      type: object
      description: Valor permitido dentro de un eje
      required: [id, valor, metadata]
      properties:
        id:
          type: string
          format: uuid
        valor:
          $ref: '#/components/schemas/TagValueLabel'
        archivadoEn:
          type: string
          format: date-time
          nullable: true
          description: Momento del archivado; `null` si el valor está activo
        metadata:
          $ref: '#/components/schemas/TagValueMetadata'

    TagKeyLabel:
      type: string
      minLength: 1
      maxLength: 40
      description: Nombre del eje, tal y como lo teclea el admin
      example: nivel

    TagValueLabel:
      type: string
      minLength: 1
      maxLength: 60
      description: Literal del valor, tal y como lo teclea el admin
      example: principiante

    TagKeyLabelRequest:
      type: object
      description: Nombre de un eje, para crearlo o renombrarlo
      required: [nombre]
      properties:
        nombre:
          $ref: '#/components/schemas/TagKeyLabel'

    TagValueLabelRequest:
      type: object
      description: Literal de un valor, para crearlo o renombrarlo
      required: [valor]
      properties:
        valor:
          $ref: '#/components/schemas/TagValueLabel'

    TagValueMetadata:
      description: |
        Apéndice tipado y opcional de un valor, discriminado por `tipo`. Los valores de ejes como
        `nivel` o `terreno` llevan `EMPTY`; los del eje `objetivo` (carreras) llevan `RACE` con
        fecha y distancia. El frontend lee el tipo del contrato, no lo deduce.

        Hoy es **solo de lectura**: no hay operación que asigne metadata, así que todo valor nuevo
        nace con `EMPTY`.

        La unión no declara `discriminator` a propósito. Con él, `openapi-generator` emite para
        Kotlin un `override val tipo` tipado como enum sobre una interfaz que lo declara `String`,
        y el código generado no compila. Sin él, ambos generadores producen lo correcto: una
        `sealed interface` con subtipos que serializan su propio `tipo`, y en TypeScript una unión
        discriminada con literales. El precio es que Jackson no puede **deserializar** la unión —
        irrelevante mientras la metadata sea de solo lectura, pero quien añada una operación de
        escritura tendrá que resolverlo (probablemente con un mixin en `infrastructure`, como ya se
        hace para el JSONB).
      oneOf:
        - $ref: '#/components/schemas/EmptyMetadata'
        - $ref: '#/components/schemas/RaceMetadata'

    EmptyMetadata:
      type: object
      description: Valor sin metadata
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [EMPTY]

    RaceMetadata:
      type: object
      description: Metadata de una carrera — fecha y distancia estándar
      required: [tipo, fecha, distancia]
      properties:
        tipo:
          type: string
          enum: [RACE]
        fecha:
          type: string
          format: date
          example: '2026-12-06'
        distancia:
          type: string
          enum: ['5K', '10K', '21K', '42K']
          description: Distancia estándar de la carrera
          example: 42K

    ErrorResponse:
      type: object
      description: |
        Error estructurado para respuestas 4xx y 5xx.
        El frontend traduce `code` a mensaje localizado; `field` solo aparece en errores de entrada.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable para que el frontend lo traduzca
          example: INVALID_INPUT
        field:
          type: string
          nullable: true
          description: |
            Campo que originó el error, cuando hay uno concreto. Habitual en los 400 de validación,
            pero no exclusivo: `DUPLICATE_LABEL` lo lleva en un 409 para señalar qué campo choca.
          example: email
        message:
          type: string
          description: Mensaje legible (orientativo, no usar para lógica de cliente)
          example: El email no tiene un formato válido
