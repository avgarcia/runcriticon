openapi: 3.0.3
info:
  title: Runcriticon API
  version: 0.1.0
  description: API REST de Runcriticon — esqueleto andante H0 (ADR-0001 D10)
servers:
  - url: /api

paths:
  /entrenadores:
    get:
      summary: Listar los entrenadores del club (solo admin, ADR-0009)
      operationId: listarEntrenadores
      tags: [entrenadores]
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
    post:
      summary: Dar de alta un entrenador por invitación
      operationId: invitarEntrenador
      tags: [entrenadores]
      requestBody:
        $ref: '#/components/requestBodies/InviteCoachBody'
      responses:
        '201':
          $ref: '#/components/responses/EntrenadorCreado'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /entrenadores/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el entrenador (invalida la anterior)
      operationId: reinvitarEntrenador
      tags: [entrenadores]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del entrenador
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Nueva invitación emitida; la anterior queda invalidada
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /usuarios/{id}/revocacion-sesiones:
    post:
      summary: Revocar todas las sesiones activas de un usuario (logout forzado por admin, ADR-0003 D11)
      operationId: revocarSesionesUsuario
      tags: [usuarios]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario cuyas sesiones se revocan
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sesiones del usuario revocadas
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'

  /usuarios/{id}/desactivacion:
    post:
      summary: Desactivar la cuenta de un usuario y cerrar sus sesiones (admin, ADR-0003 D11)
      operationId: desactivarUsuario
      tags: [usuarios]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a desactivar
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cuenta desactivada; sus sesiones activas quedan revocadas
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /alumnos:
    post:
      summary: Dar de alta un alumno por invitación
      operationId: invitarAlumno
      tags: [alumnos]
      requestBody:
        $ref: '#/components/requestBodies/InviteStudentBody'
      responses:
        '201':
          $ref: '#/components/responses/AlumnoCreado'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /alumnos/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el alumno (invalida la anterior)
      operationId: reinvitarAlumno
      tags: [alumnos]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del alumno
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Nueva invitación emitida; la anterior queda invalidada
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /activacion:
    post:
      summary: Activar la cuenta fijando contraseña con el token de invitación
      operationId: activarCuenta
      tags: [activacion]
      requestBody:
        $ref: '#/components/requestBodies/ActivationBody'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /sesion:
    post:
      summary: Iniciar sesión con email y contraseña (ADR-0003 D5)
      operationId: iniciarSesion
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/CredentialsBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '409':
          description: |
            Contraseña caducada (ADR-0003 D7). Cuerpo ErrorResponse con `code=PASSWORD_EXPIRED`;
            no se crea sesión. El cliente debe llevar al cambio obligatorio (POST /sesion/contrasena).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sesion/actual:
    get:
      summary: Consultar la sesión en curso
      operationId: consultarSesion
      tags: [sesion]
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'

  /sesion/cierre:
    post:
      summary: Cerrar la sesión en curso (ADR-0003 D11)
      operationId: cerrarSesion
      tags: [sesion]
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'

  /sesion/contrasena:
    post:
      summary: Fijar una contraseña nueva cuando la actual ha caducado (ADR-0003 D7)
      operationId: cambiarContrasenaCaducada
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /sesion/magic-link:
    post:
      summary: Solicitar un magic link de login (ADR-0003 D5)
      operationId: solicitarMagicLink
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkBody'
      responses:
        '202':
          description: |
            Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace. Respuesta
            neutra (ADR-0003 D5): idéntica exista o no la cuenta, para no revelar si un email está
            registrado.
        '400':
          $ref: '#/components/responses/ErrorBadRequest'

  /sesion/magic-link/consumo:
    post:
      summary: Consumir un magic link e iniciar sesión (ADR-0003 D5)
      operationId: consumirMagicLink
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /sesion/reseteo:
    post:
      summary: Solicitar un reseteo de contraseña por magic link (ADR-0003 D8)
      operationId: solicitarReseteo
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetBody'
      responses:
        '202':
          description: |
            Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace para
            restablecer la contraseña. Respuesta neutra (ADR-0003 D8): idéntica exista o no la
            cuenta, para no revelar si un email está registrado.
        '400':
          $ref: '#/components/responses/ErrorBadRequest'

  /sesion/reseteo/consumo:
    post:
      summary: Consumir un reseteo de contraseña, fijar la nueva e iniciar sesión (ADR-0003 D8)
      operationId: consumirReseteo
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /me/permissions:
    get:
      summary: Consultar los propios permisos (ADR-0009 D18)
      description: |
        Mapa `{ recurso: [acciones] }` calculado server-side desde la matriz de autorización para el
        rol del usuario actual. Es ayuda de UX para ocultar botones — nunca una barrera: cada
        petición real se autoriza en el servidor con independencia de lo que este endpoint devuelva.
      operationId: consultarMisPermisos
      tags: [me]
      responses:
        '200':
          description: Permisos concedidos al rol del principal actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'

components:
  requestBodies:
    InviteCoachBody:
      description: Datos necesarios para dar de alta un entrenador
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachRequest'

    InviteStudentBody:
      description: Datos necesarios para dar de alta un alumno
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentRequest'

    ActivationBody:
      description: Token de invitación y contraseña elegida
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationRequest'

    CredentialsBody:
      description: Email y contraseña para iniciar sesión
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialsRequest'

    PasswordChangeBody:
      description: Email, contraseña caducada y contraseña nueva (cambio forzado, ADR-0003 D7)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeRequest'

    MagicLinkBody:
      description: Email para el que se solicita el magic link
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkRequest'

    MagicLinkConsumeBody:
      description: Token del magic link a consumir
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkConsumeRequest'

    PasswordResetBody:
      description: Email para el que se solicita el reseteo de contraseña
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'

    PasswordResetConsumeBody:
      description: Token del reseteo y contraseña nueva
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetConsumeRequest'

  responses:
    EntrenadorCreado:
      description: Entrenador creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachResponse'

    EntrenadoresListados:
      description: Lista de entrenadores del club
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CoachSummary'

    AlumnoCreado:
      description: Alumno creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentResponse'

    CuentaActivada:
      description: Cuenta activada; sesión iniciada (cookie httpOnly)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationResponse'

    SesionIniciada:
      description: Sesión iniciada; cookie de sesión httpOnly establecida (ADR-0003 D10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'

    ErrorBadRequest:
      description: Entrada inválida (campo requerido vacío, formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorUnauthorized:
      description: No autenticado; la sesión ha expirado o no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorForbidden:
      description: El principal no tiene permiso (ADR-0009 D12 — cuerpo neutro sin detalles)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorNotFound:
      description: Recurso no encontrado o no pertenece al club del principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorConflict:
      description: La operación choca con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorTooManyRequests:
      description: |
        Límite de rate-limiting alcanzado (ADR-0003 D12). Cuerpo ErrorResponse con `code=RATE_LIMITED`
        y cabecera `Retry-After` (segundos). Los flujos anónimos de magic link y reseteo NO devuelven
        429: mantienen su 202 neutro para no revelar que se alcanzó un límite.
      headers:
        Retry-After:
          description: Segundos recomendados antes de reintentar
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    InviteCoachRequest:
      type: object
      description: Datos necesarios para dar de alta un entrenador por invitación
      required: [nombre, email]
      properties:
        nombre:
          type: string
          description: Nombre completo del entrenador
          minLength: 1
          maxLength: 200
          example: Ana García
        email:
          type: string
          format: email
          description: Dirección de email del entrenador (identificador único en el club)
          maxLength: 254
          example: ana@club.es

    InviteCoachResponse:
      type: object
      description: Respuesta al alta del entrenador
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado

    CoachSummary:
      type: object
      description: Vista de lectura de un entrenador para el listado admin (LAL-13)
      required: [id, nombre, email, estado]
      properties:
        id:
          type: string
          format: uuid
          description: ID del entrenador
        nombre:
          type: string
          description: Nombre completo del entrenador
        email:
          type: string
          format: email
          description: Email del entrenador
        estado:
          type: string
          description: Estado de la cuenta (INVITADO, ACTIVO, DESACTIVADO)
          enum: [INVITADO, ACTIVO, DESACTIVADO]

    InviteStudentRequest:
      type: object
      description: Datos necesarios para dar de alta un alumno por invitación
      required: [nombre, email]
      properties:
        nombre:
          type: string
          description: Nombre completo del alumno
          minLength: 1
          maxLength: 200
          example: Marta Ruiz
        email:
          type: string
          format: email
          description: Dirección de email del alumno (identificador único en el club)
          maxLength: 254
          example: marta@club.es

    InviteStudentResponse:
      type: object
      description: Respuesta al alta del alumno
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado

    ActivationRequest:
      type: object
      description: Datos para activar la cuenta por invitación (ADR-0003 D4, D6)
      required: [token, password]
      properties:
        token:
          type: string
          description: Token de invitación recibido en el email
          minLength: 1
        password:
          type: string
          format: password
          description: Contraseña elegida; política ADR-0003 D6 (12–128, sin datos personales, no reutilizada)
          minLength: 12
          maxLength: 128

    ActivationResponse:
      type: object
      description: Sesión iniciada tras la activación (mismo shape que la sesión de login)
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        role:
          type: string
          description: Rol del usuario (ADMIN, ENTRENADOR, ALUMNO)

    CredentialsRequest:
      type: object
      description: Credenciales de login con contraseña (ADR-0003 D5)
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254
        password:
          type: string
          format: password
          description: Contraseña en claro (se verifica contra el hash Argon2id)
          minLength: 1
          maxLength: 128

    SessionResponse:
      type: object
      description: Sesión iniciada; nunca incluye datos sensibles ni el hash de la contraseña
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        role:
          type: string
          description: Rol del usuario (ADMIN, ENTRENADOR, ALUMNO)

    PermissionsResponse:
      type: object
      description: |
        Mapa `{ recurso: [acciones] }` (ADR-0009 D18). Las claves son los recursos protegidos por la
        matriz (COACH, STUDENT, USER); cada valor es la lista de acciones concedidas al rol del
        principal actual sobre ese recurso. Un recurso sin acciones concedidas no aparece en el mapa.
      additionalProperties:
        type: array
        items:
          type: string

    PasswordChangeRequest:
      type: object
      description: |
        Cambio forzado de contraseña caducada (ADR-0003 D7). Revalida la contraseña actual (la
        caducada que el usuario tecleó) y fija la nueva (política D6); al lograrlo, inicia sesión.
      required: [email, currentPassword, newPassword]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254
        currentPassword:
          type: string
          format: password
          description: Contraseña actual (caducada) para revalidar la identidad
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          description: Contraseña nueva; política ADR-0003 D6 (12–128, sin datos personales, no reutilizada)
          minLength: 12
          maxLength: 128

    MagicLinkRequest:
      type: object
      description: Email para el que se solicita un magic link de login (ADR-0003 D5)
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254

    MagicLinkConsumeRequest:
      type: object
      description: Token del magic link recibido en el email (un solo uso, 15 min)
      required: [token]
      properties:
        token:
          type: string
          description: Token de un solo uso recibido en el email
          minLength: 1

    PasswordResetRequest:
      type: object
      description: Email para el que se solicita un reseteo de contraseña (ADR-0003 D8)
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254

    PasswordResetConsumeRequest:
      type: object
      description: |
        Token del reseteo recibido en el email (un solo uso, 15 min) y contraseña nueva. Al fijarla,
        el backend invalida todas las sesiones activas del usuario (ADR-0003 D8) e inicia sesión.
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Token de un solo uso recibido en el email de reseteo
          minLength: 1
        newPassword:
          type: string
          format: password
          description: Contraseña nueva; política ADR-0003 D6 (12–128, sin datos personales, no reutilizada)
          minLength: 12
          maxLength: 128

    ErrorResponse:
      type: object
      description: |
        Error estructurado para respuestas 4xx (ADR-0012 D19).
        El frontend traduce `code` a mensaje localizado; `field` solo aparece en errores de entrada.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable para que el frontend lo traduzca
          example: INVALID_INPUT
        field:
          type: string
          nullable: true
          description: Campo que originó el error (solo en 400 con campo concreto)
          example: email
        message:
          type: string
          description: Mensaje legible (orientativo, no usar para lógica de cliente)
          example: El email no tiene un formato válido
        details:
          type: string
          nullable: true
          description: Información adicional de depuración (solo en entornos no productivos)
