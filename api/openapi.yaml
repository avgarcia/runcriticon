openapi: 3.0.3
info:
  title: Runcriticon API
  version: 0.1.0
  description: API REST de Runcriticon
servers:
  - url: /api
    description: Mismo origen que la SPA (cookie de sesión first-party, sin CORS)

tags:
  - name: entrenadores
    description: Alta y listado de entrenadores del club
  - name: alumnos
    description: Alta y reinvitación de alumnos del club
  - name: usuarios
    description: Acciones administrativas sobre cuentas de usuario (revocar sesiones, desactivar)
  - name: sesion
    description: Inicio, consulta y cierre de sesión, magic link y reseteo de contraseña
  - name: activacion
    description: Activación de cuentas invitadas
  - name: me
    description: Datos del propio usuario autenticado
  - name: club
    description: Ficha del club
  - name: taxonomia
    description: Ejes (tags) y valores con los que el club clasifica a sus alumnos
  - name: clasificacion
    description: Asignación de valores de la taxonomía a los alumnos del club
  - name: grupos
    description: Grupos del club (consulta nombrada sobre tags) y previsualización de sus miembros
  - name: planes
    description: Planes semanales en borrador de un grupo (módulo planificación)
  - name: seguimiento
    description: El plan ya resuelto para el propio alumno (módulo seguimiento)
  - name: alertas
    description: Alertas del entrenador por excepción sobre sus alumnos (módulo seguimiento)

security:
  - cookieAuth: []

paths:
  /entrenadores:
    get:
      summary: Listar los entrenadores del club (solo admin)
      description: |
        Devuelve todos los entrenadores del club del principal con su estado de cuenta
        (INVITADO, ACTIVO, DESACTIVADO). Solo el ADMIN puede consultarlo.
      operationId: listarEntrenadores
      tags: [entrenadores]
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Dar de alta un entrenador por invitación
      description: |
        Crea un entrenador en estado INVITADO y le envía por email el enlace de activación (token de
        un solo uso). Solo el ADMIN. Rechaza el alta con 409 si ya existe un usuario con ese email en
        el club.
      operationId: invitarEntrenador
      tags: [entrenadores]
      requestBody:
        $ref: '#/components/requestBodies/InviteCoachBody'
      responses:
        '201':
          $ref: '#/components/responses/EntrenadorCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /entrenadores/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el entrenador (invalida la anterior)
      description: |
        Emite una invitación nueva para un entrenador que sigue pendiente de activar, invalida la
        anterior y reenvía el email. Solo el ADMIN. Devuelve 404 si el usuario no existe o no es
        entrenador, y 409 si ya está activo.
      operationId: reinvitarEntrenador
      tags: [entrenadores]
      parameters:
        - $ref: '#/components/parameters/EntrenadorId'
      responses:
        '204':
          $ref: '#/components/responses/InvitacionReemitida'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /entrenadores/resumen:
    get:
      summary: Listar los entrenadores del club con su carga (solo admin)
      description: |
        Devuelve los entrenadores del club del principal con su estado (INVITADO, ACTIVO — la
        proyección local de club y taxonomía no conoce DESACTIVADO, distinto de `GET /entrenadores`)
        y los grupos que tiene asignados con cuántos alumnos suma cada uno. Solo el ADMIN.

        `grupos` sale vacía y `totalAlumnos` a 0 para todos los entrenadores mientras no exista la
        asignación entrenador↔grupo: es la base intencionada sobre la que se construye después, no
        una limitación oculta.
      operationId: listarResumenDeEntrenadores
      tags: [entrenadores]
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresResumenListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /usuarios/{id}:
    delete:
      summary: Eliminar a una persona del club y todos sus datos personales (admin)
      description: |
        Ejerce el derecho de supresión: borra físicamente al usuario y sus datos personales
        asociados (invitaciones, magic links, histórico de contraseñas), revoca sus sesiones y
        propaga la baja al resto de módulos por evento. Es **irreversible**. Solo el ADMIN.

        Se puede eliminar una cuenta en cualquier estado (invitada, activa o desactivada): el
        derecho de supresión no depende del estado de la cuenta. Devuelve 404 si el usuario no
        pertenece al club del principal —y también al repetir la llamada, porque ya no existe— y
        409 si el admin intenta eliminarse a sí mismo o eliminar al último administrador del club.
      operationId: eliminarUsuario
      tags: [usuarios]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          $ref: '#/components/responses/UsuarioEliminado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /usuarios/{id}/revocacion-sesiones:
    post:
      summary: Revocar todas las sesiones activas de un usuario (logout forzado por admin)
      description: |
        Cierra de forma inmediata todas las sesiones activas del usuario (logout forzado). Solo el
        ADMIN. Devuelve 404 si el usuario no pertenece al club del principal.
      operationId: revocarSesionesUsuario
      tags: [usuarios]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          $ref: '#/components/responses/SesionesRevocadas'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /usuarios/{id}/desactivacion:
    post:
      summary: Desactivar la cuenta de un usuario y cerrar sus sesiones (admin)
      description: |
        Desactiva la cuenta del usuario y revoca sus sesiones activas al instante. Solo el ADMIN.
        Devuelve 404 si el usuario no pertenece al club, y 409 si la cuenta ya estaba desactivada.
      operationId: desactivarUsuario
      tags: [usuarios]
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          $ref: '#/components/responses/CuentaDesactivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos:
    get:
      summary: Listar los alumnos del club con sus tags
      description: |
        Devuelve los alumnos del club con su nombre, email, estado y los valores de taxonomía que
        tienen asignados. El ADMIN o el ENTRENADOR; hoy ambos ven los mismos alumnos, porque todavía
        no existe la asignación de entrenadores a grupos ni a alumnos.

        `tagValueId` es repetible y se acumula en AND, igual que el filtro de un grupo. **Sin
        `tagValueId`, la respuesta trae todos los alumnos del club** — a diferencia de
        `previsualizarMiembrosDeGrupo`, aquí el estado base de la pantalla es la lista completa, no
        el conjunto vacío.

        `valores` trae siempre **todos** los tags que tiene el alumno, no solo los del filtro: el
        rótulo de cada eje y de cada valor lo compone el cliente con la taxonomía, que ya conoce.
        Un `tagValueId` desconocido o de otro club no hace fallar la petición: simplemente no
        encaja con nadie y la respuesta sale vacía.

        No se pagina ni se trunca: el dimensionado previsto es de un par de cientos de alumnos por
        club.
      operationId: listarAlumnos
      tags: [alumnos]
      parameters:
        - $ref: '#/components/parameters/TagValueIdFiltroAlumnos'
      responses:
        '200':
          $ref: '#/components/responses/AlumnosListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Dar de alta un alumno por invitación
      description: |
        Crea un alumno en estado INVITADO y le envía por email el enlace de activación. Lo pueden
        ejecutar el ADMIN y el ENTRENADOR (delegación). Rechaza el alta con 409 si ya existe un
        usuario con ese email en el club.
      operationId: invitarAlumno
      tags: [alumnos]
      requestBody:
        $ref: '#/components/requestBodies/InviteStudentBody'
      responses:
        '201':
          $ref: '#/components/responses/AlumnoCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el alumno (invalida la anterior)
      description: |
        Emite una invitación nueva para un alumno que sigue pendiente de activar, invalida la anterior
        y reenvía el email. ADMIN o ENTRENADOR (delegación). Devuelve 404 si el usuario no existe o no
        es alumno, y 409 si ya está activo.
      operationId: reinvitarAlumno
      tags: [alumnos]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
      responses:
        '204':
          $ref: '#/components/responses/InvitacionReemitida'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos/{id}/tags:
    get:
      summary: Consultar los valores de la taxonomía asignados a un alumno
      description: |
        Devuelve la clasificación actual del alumno. ADMIN o ENTRENADOR. Puede incluir valores
        archivados: archivar deja de ofrecer un valor para asignaciones nuevas, pero conserva las
        que ya existían.
      operationId: consultarTagsDelAlumno
      tags: [clasificacion]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
      responses:
        '200':
          $ref: '#/components/responses/TagsDelAlumno'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    put:
      summary: Reemplazar por completo la clasificación de un alumno
      description: |
        Deja al alumno exactamente con los valores indicados: lo que no aparezca en la lista se
        desasigna. Una lista vacía borra toda su clasificación. ADMIN o ENTRENADOR.

        Es idempotente: repetir la misma lista devuelve 200 y el mismo cuerpo. Un valor archivado
        que el alumno **ya tenía** se conserva sin error; añadir uno archivado que no tenía devuelve
        409.
      operationId: reemplazarTagsDelAlumno
      tags: [clasificacion]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
      requestBody:
        $ref: '#/components/requestBodies/StudentTagsBody'
      responses:
        '200':
          $ref: '#/components/responses/TagsDelAlumno'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Asignar un valor más a un alumno, sin tocar el resto
      description: |
        Añade un valor a la clasificación que el alumno ya tiene. ADMIN o ENTRENADOR. Devuelve la
        clasificación completa resultante, no el valor suelto, para que el cliente no tenga que
        recomponerla.

        Es idempotente: asignar un valor que el alumno ya tenía no cambia nada y devuelve 200.
        Asignar un valor archivado que no tenía devuelve 409.
      operationId: asignarTagAlAlumno
      tags: [clasificacion]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
      requestBody:
        $ref: '#/components/requestBodies/StudentTagAssignmentBody'
      responses:
        '200':
          $ref: '#/components/responses/TagsDelAlumno'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alumnos/{id}/tags/{valorId}:
    delete:
      summary: Quitar un valor de la clasificación de un alumno
      description: |
        Desasigna el valor. ADMIN o ENTRENADOR. Es idempotente: devuelve 204 tanto si el alumno
        tenía el valor como si no.

        No comprueba el estado del valor en la taxonomía: un valor archivado —o incluso uno que ya
        no exista— siempre se puede quitar de un alumno. Lo contrario dejaría clasificaciones
        imposibles de limpiar.
      operationId: desasignarTagDelAlumno
      tags: [clasificacion]
      parameters:
        - $ref: '#/components/parameters/AlumnoId'
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '204':
          $ref: '#/components/responses/TagDesasignado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /activacion:
    post:
      summary: Activar la cuenta fijando contraseña con el token de invitación
      description: |
        Activa una cuenta invitada fijando su contraseña con el token del email (un solo uso) y, al
        lograrlo, inicia sesión (auto-login, cookie httpOnly). Endpoint anónimo. Devuelve 400/404 si
        el token es inválido o caducado, y 409 si la cuenta ya está activa.
      operationId: activarCuenta
      tags: [activacion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/ActivationBody'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion:
    post:
      summary: Iniciar sesión con email y contraseña
      description: |
        Autentica con email y contraseña y abre sesión (cookie httpOnly). El fallo de credenciales es
        401 neutro (no distingue email inexistente de contraseña incorrecta); tras varios fallos
        aplica backoff progresivo con 429 y cabecera Retry-After. Una contraseña caducada devuelve 409
        con code=PASSWORD_EXPIRED sin crear sesión.
      operationId: iniciarSesion
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CredentialsBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ContrasenaCaducada'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/actual:
    get:
      summary: Consultar la sesión en curso
      description: |
        Devuelve el principal de la sesión en curso (userId, clubId y rol). Requiere una sesión
        activa; sin cookie válida responde 401.
      operationId: consultarSesion
      tags: [sesion]
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/cierre:
    post:
      summary: Cerrar la sesión en curso
      description: |
        Cierra la sesión en curso e invalida la cookie de sesión. Requiere una sesión activa.
      operationId: cerrarSesion
      tags: [sesion]
      responses:
        '204':
          $ref: '#/components/responses/SesionCerrada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/contrasena:
    post:
      summary: Fijar una contraseña nueva cuando la actual ha caducado
      description: |
        Fija una contraseña nueva cuando la actual ha caducado: revalida con la contraseña caducada y,
        al lograrlo, inicia sesión (cookie httpOnly). Es el paso siguiente al 409 PASSWORD_EXPIRED del
        login. Devuelve 401 si la contraseña actual no es válida y 409 si no estaba caducada.
      operationId: cambiarContrasenaCaducada
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/magic-link:
    post:
      summary: Solicitar un magic link de login
      description: |
        Solicita un enlace mágico de acceso para el email indicado. Responde siempre 202 neutro,
        exista o no la cuenta, para no revelar si un email está registrado. Si el email corresponde a
        una cuenta activa, se envía el enlace por email.
      operationId: solicitarMagicLink
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkBody'
      responses:
        '202':
          $ref: '#/components/responses/MagicLinkSolicitado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/magic-link/consumo:
    post:
      summary: Consumir un magic link e iniciar sesión
      description: |
        Consume el token del enlace mágico e inicia sesión (cookie httpOnly). El token es de un solo
        uso y caduca a los 15 min; uno inválido o caducado devuelve 400/404.
      operationId: consumirMagicLink
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/MagicLinkConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/reseteo:
    post:
      summary: Solicitar un reseteo de contraseña por magic link
      description: |
        Solicita un enlace de reseteo de contraseña para el email indicado. Responde siempre 202
        neutro, exista o no la cuenta, para no revelar si un email está registrado. Si el email
        corresponde a una cuenta activa, se envía el enlace por email.
      operationId: solicitarReseteo
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetBody'
      responses:
        '202':
          $ref: '#/components/responses/ReseteoSolicitado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /sesion/reseteo/consumo:
    post:
      summary: Consumir un reseteo de contraseña, fijar la nueva e iniciar sesión
      description: |
        Consume el token de reseteo (un solo uso, 15 min), fija la contraseña nueva, invalida todas
        las sesiones activas del usuario e inicia sesión. Un token inválido o caducado devuelve
        400/404.
      operationId: consumirReseteo
      tags: [sesion]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetConsumeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /club:
    get:
      summary: Consultar la ficha del propio club
      description: |
        Devuelve la ficha del club del principal (nombre, slug). Cualquier rol autenticado puede
        consultarla — no hay regla RBAC distinta por rol.
      operationId: consultarClub
      tags: [club]
      responses:
        '200':
          $ref: '#/components/responses/ClubActual'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    patch:
      summary: Cambiar el nombre del club
      description: |
        Cambia el nombre del club del principal. Solo el ADMIN. `nombre` es el único campo editable
        del MVP y va como `required` en el cuerpo para evitar la ambigüedad ausente-vs-null propia de
        PATCH.
      operationId: actualizarClub
      tags: [club]
      requestBody:
        $ref: '#/components/requestBodies/ClubPatchBody'
      responses:
        '200':
          $ref: '#/components/responses/ClubActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/consentimiento:
    get:
      summary: Consultar el propio estado de consentimiento de datos de salud
      description: |
        Estado del consentimiento explícito de datos de salud del art. 9.2.a RGPD (ADR-0014 D16/D18,
        LAL-128) del propio alumno. `PENDIENTE` significa que nunca ha concedido — típicamente porque
        activó su cuenta antes de que existiera este mecanismo.
      operationId: consultarMiConsentimiento
      tags: [identidad]
      responses:
        '200':
          $ref: '#/components/responses/MiConsentimiento'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Conceder (o volver a conceder) el consentimiento de datos de salud
      description: |
        Idempotente si ya está vigente: no crea una fila redundante. `versionConsentimiento` debe
        coincidir con la versión vigente del texto (409 si no).
      operationId: concederMiConsentimiento
      tags: [identidad]
      requestBody:
        $ref: '#/components/requestBodies/ConcederConsentimientoBody'
      responses:
        '200':
          $ref: '#/components/responses/MiConsentimiento'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Revocar el consentimiento de datos de salud
      description: |
        Tras revocar, el módulo Seguimiento deja de aceptar nuevos reportes de sesión de este alumno
        hasta que vuelva a conceder (ADR-0014 D18). 409 si no hay ningún consentimiento vigente que
        revocar.
      operationId: revocarMiConsentimiento
      tags: [identidad]
      responses:
        '200':
          $ref: '#/components/responses/MiConsentimiento'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/marcas:
    get:
      summary: Consultar las propias marcas
      description: |
        Las cuatro marcas del propio alumno (5K/10K/21K/42K, LAL-31, ADR-0002 D7), en ese orden fijo —
        `tiempoSegundos`/`modificadoEn` ausentes en las distancias sin marca todavía. Privacidad
        fuerte: solo el ALUMNO; no existe ningún endpoint equivalente para ADMIN/ENTRENADOR, ni
        siquiera agregado.
      operationId: consultarMisMarcas
      tags: [seguimiento]
      responses:
        '200':
          $ref: '#/components/responses/MisMarcas'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/marcas/{distancia}:
    put:
      summary: Registrar (o editar) la propia marca de una distancia
      description: |
        Envío idempotente (LAL-31): una marca por distancia, sin histórico — la primera vez crea, las
        siguientes sobreescribe. Solo el ALUMNO, siempre sobre su propia marca (`alumnoId` es siempre
        el del principal). Emite `MarcaActualizada`.
      operationId: registrarMiMarca
      tags: [seguimiento]
      parameters:
        - $ref: '#/components/parameters/DistanciaMarcaPath'
      requestBody:
        $ref: '#/components/requestBodies/MiMarcaBody'
      responses:
        '200':
          $ref: '#/components/responses/MiMarca'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Retirar la propia marca de una distancia
      description: |
        Idempotente (LAL-31): `204` tanto si borró una marca como si no había ninguna. Emite
        `MarcaRetirada` solo cuando de verdad borra una fila — los ritmos relativos que dependían de
        ella vuelven a "no resuelto" (LAL-32, consumidor futuro del evento).
      operationId: retirarMiMarca
      tags: [seguimiento]
      parameters:
        - $ref: '#/components/parameters/DistanciaMarcaPath'
      responses:
        '204':
          description: Marca retirada (o ya no existía)
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/permissions:
    get:
      summary: Consultar los propios permisos
      description: |
        Mapa `{ recurso: [acciones] }` calculado server-side desde la matriz de autorización para el
        rol del usuario actual. Es ayuda de UX para ocultar botones — nunca una barrera: cada
        petición real se autoriza en el servidor con independencia de lo que este endpoint devuelva.
      operationId: consultarMisPermisos
      tags: [me]
      responses:
        '200':
          $ref: '#/components/responses/MisPermisos'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/plan:
    get:
      summary: Consultar la propia semana resuelta
      description: |
        La semana del propio alumno, ya resuelta (LAL-29): lee directamente de la proyección local
        `seguimiento.plan_resuelto_por_alumno`, alimentada por `PlanPublicado` — nunca se resuelve en
        tiempo de petición. Solo el ALUMNO; `alumnoId` es siempre el del principal, nunca un parámetro.

        `semana` es opcional y debe ser un lunes; si se omite, se usa el lunes de la semana en curso
        (zona horaria del club). Un día sin sesión publicada para ese alumno simplemente no aparece en
        `sesiones` — este endpoint no distingue todavía "sin sesión ese día", "el entrenador no ha
        publicado el plan" y "sin grupo asignado" (quedan unificados hasta que exista una segunda
        proyección sobre la membresía del alumno).
      operationId: consultarMiSemana
      tags: [seguimiento]
      parameters:
        - name: semana
          in: query
          required: false
          description: Lunes de la semana a consultar (YYYY-MM-DD). Por defecto, el lunes en curso.
          schema:
            type: string
            format: date
            example: '2026-08-17'
      responses:
        '200':
          $ref: '#/components/responses/MiSemanaResuelta'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/reajustes/{dia}:
    put:
      summary: Reajustar (o editar) el día de una sesión
      description: |
        Envío idempotente (LAL-33): la primera vez crea el reajuste, las siguientes lo reemplaza —
        reajustar dos veces el mismo día es editar, nunca crea un segundo reajuste. Solo el ALUMNO, y
        solo sobre un día con sesión ya resuelta para él (`alumnoId` es siempre el del principal), sin
        depender de respuesta del entrenador (`docs/research/findings.md` §P3).

        `diaDestino` obligatorio si `accion` es `MOVIDA` (hasta 7 días vista), ausente si es
        `SALTADA`. `marcaDolor` no se envía: se activa sola cuando `motivo` es `MOLESTIAS`, mismo
        criterio que `MiReporteRequest`.

        Si `diaDestino` ya tiene una sesión efectiva, responde `409 DIA_DESTINO_OCUPADO` salvo que la
        petición traiga `resolucionConflicto` (`REEMPLAZAR` marca la sesión ocupante como saltada;
        `INTERCAMBIAR` la mueve al día de origen) — ver wireframe 07 §Flujo B.

        No se puede reajustar una sesión de un día pasado. Este endpoint nunca modifica el plan
        publicado: el reajuste se superpone en la lectura de `GET /me/plan` (ADR-0002 D5, snapshot
        congelado) — no contradice que una sesión del entrenador "no se pueda mover de día" (ver el
        `PATCH` de planificación): ese endpoint edita el plan en sí, este superpone la vista del alumno
        sobre un plan que sigue intacto.
      operationId: reajustarDia
      tags: [seguimiento]
      parameters:
        - $ref: '#/components/parameters/DiaReajustadoPath'
      requestBody:
        $ref: '#/components/requestBodies/MiReajusteBody'
      responses:
        '200':
          $ref: '#/components/responses/MiReajusteAplicado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Deshacer el reajuste de un día
      description: |
        Idempotente (LAL-33): `204` tanto si deshizo un reajuste como si no había ninguno — mismo
        criterio que `DELETE /me/marcas/{distancia}`. Deshace la operación completa: si el reajuste
        formaba parte de un `REEMPLAZAR`/`INTERCAMBIAR`, revierte las dos sesiones afectadas, no solo
        la de este día.
      operationId: deshacerReajuste
      tags: [seguimiento]
      parameters:
        - $ref: '#/components/parameters/DiaReajustadoPath'
      responses:
        '204':
          description: Reajuste deshecho (o ya no existía)
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /me/reportes/{dia}:
    put:
      summary: Reportar (o editar) la sesión de un día
      description: |
        Envío idempotente (LAL-30): la primera vez crea el reporte, las siguientes lo reemplaza —
        reportar dos veces el mismo día es editar, nunca crea un segundo reporte. Solo el ALUMNO, y
        solo sobre un día con sesión publicada para él (`alumnoId` es siempre el del principal).

        `valoracion` es obligatoria si `estado` es `HECHO` o `PARCIAL`, y no debe enviarse si es
        `NO_HECHO`. `motivo` es obligatorio si `estado` es `NO_HECHO`, y no debe enviarse en el resto.
        `marcaDolor` no se envía: se activa sola cuando `motivo` es `MOLESTIAS`
        (`docs/glosario.md` §Seguimiento).

        Devuelve la sesión del día ya con el reporte aplicado, para no obligar a una segunda consulta.
      operationId: reportarSesion
      tags: [seguimiento]
      parameters:
        - $ref: '#/components/parameters/DiaReporteadoPath'
      requestBody:
        $ref: '#/components/requestBodies/MiReporteBody'
      responses:
        '200':
          $ref: '#/components/responses/MiSesionReportada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /alertas:
    get:
      summary: Listar las alertas activas del entrenador (LAL-116)
      description: |
        Panel de alertas por excepción (M17): solo lo accionable, nunca los entrenos normales. Tres
        tipos en el MVP — molestias reportadas, alumno sin reportar más de 7 días, y sesión reportada
        con el ritmo muy fuera del objetivo (heurística de texto sobre las notas del reporte; un
        análisis real de FIT/GPX queda fuera del MVP). Sin "descartar": es un panel de **solo
        lectura**, una alerta deja de aparecer sola cuando deja de cumplirse la condición.

        Solo el ENTRENADOR, y solo sobre alumnos de sus propios grupos — el filtrado va embebido en
        la consulta, nunca se listan alumnos de grupos ajenos. `grupoId` inexistente o ajeno al
        entrenador devuelve una lista vacía, no 404 (mismo criterio que `GET /planes`).

        Nunca deriva de las marcas privadas del alumno (`/me/marcas`) — ver la nota de privacidad en
        `CoachAlert`.
      operationId: listarAlertasEntrenador
      tags: [alertas]
      parameters:
        - name: grupoId
          in: query
          required: false
          description: Filtra a un solo grupo. Por defecto, todos los grupos del entrenador.
          schema:
            $ref: '#/components/schemas/GroupId'
      responses:
        '200':
          $ref: '#/components/responses/AlertasListadas'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia:
    get:
      summary: Consultar la taxonomía del club
      description: |
        Devuelve la taxonomía completa del club del principal: todos sus ejes con sus valores,
        **incluidos los archivados** — `archivadoEn` distingue unos de otros, y el editor los
        muestra atenuados con opción de reactivarlos. La consultan el ADMIN y el ENTRENADOR; el
        ALUMNO no. No se pagina: el dimensionado previsto es de decenas de ejes y cientos de
        valores, una sola pantalla.
      operationId: consultarTaxonomia
      tags: [taxonomia]
      responses:
        '200':
          $ref: '#/components/responses/TaxonomiaActual'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags:
    post:
      summary: Crear un eje de la taxonomía
      description: |
        Crea un eje nuevo. Solo el ADMIN. El nombre se guarda tal y como se teclea, pero la
        unicidad se comprueba ignorando mayúsculas, acentos y espacios de los extremos, y solo
        contra los ejes **activos**: un nombre archivado se puede reutilizar.
      operationId: crearTag
      tags: [taxonomia]
      requestBody:
        $ref: '#/components/requestBodies/TagKeyLabelBody'
      responses:
        '201':
          $ref: '#/components/responses/TagCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}:
    patch:
      summary: Renombrar un eje de la taxonomía
      description: |
        Cambia el nombre del eje. Solo el ADMIN. `nombre` va como `required` en el cuerpo para
        evitar la ambigüedad ausente-vs-null propia de PATCH. Renombrar un eje archivado se permite
        y no compite por la unicidad.
      operationId: renombrarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        $ref: '#/components/requestBodies/TagKeyLabelBody'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}/impacto-archivado:
    get:
      summary: Impacto de archivar un eje, antes de confirmarlo
      description: |
        Cuántos alumnos tienen asignado algún valor del eje (informativo: archivar no toca esas
        asignaciones, ADR-0002 D10) y qué grupos vivos exigen alguno de sus valores en su filtro
        (bloqueante: archivar un eje requerido por un grupo vivo se rechaza con 409). Solo el ADMIN
        — misma autorización que archivar, del que es el paso previo.
      operationId: impactoArchivadoTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          $ref: '#/components/responses/ImpactoArchivado'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/archivados/{tagId}:
    put:
      summary: Archivar un eje de la taxonomía
      description: |
        Archiva el eje (soft-delete): deja de ofrecerse para clasificar, pero ni él ni las
        asignaciones existentes se borran. Sin cascada — sus valores conservan su propio
        `archivadoEn`. Solo el ADMIN.

        `archivados` es la colección de ejes archivados y archivar es **pertenecer a ella**: `PUT`
        mete el eje, `DELETE` lo saca. `PUT` es idempotente por definición, que es justo la
        semántica del dominio — re-archivar conserva la marca original.

        Se rechaza con 409 si algún valor del eje es requerido por el filtro de un grupo vivo
        (ADR-0002 D10, "reglas de bloqueo"): el admin debe reescribir el filtro del grupo primero.
        `GET .../impacto-archivado` da esa lista antes de intentarlo.
      operationId: archivarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Reactivar un eje archivado
      description: |
        Saca el eje de la colección de archivados. Solo el ADMIN. Idempotente sobre un eje ya
        activo. Devuelve 409 si, mientras estaba archivado, se creó otro eje activo con el mismo
        nombre normalizado. No reactiva sus valores: cada uno conserva su propio `archivadoEn`.
      operationId: reactivarTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          $ref: '#/components/responses/TagActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/tags/{tagId}/valores:
    post:
      summary: Añadir un valor a un eje
      description: |
        Crea un valor dentro del eje. Solo el ADMIN. La unicidad es **dentro del eje**, no del club:
        el mismo valor puede existir en dos ejes distintos. Devuelve 409 si el eje está archivado.

        El valor nace sin metadata; asignar metadata de carrera (fecha y distancia) llegará con su
        propia operación.
      operationId: crearValorTag
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        $ref: '#/components/requestBodies/TagValueLabelBody'
      responses:
        '201':
          $ref: '#/components/responses/ValorCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/valores/{valorId}:
    patch:
      summary: Renombrar un valor de la taxonomía
      description: |
        Cambia el literal del valor. Solo el ADMIN. Afecta a todos los alumnos que lo tuvieran
        asignado — no se duplica ni se crea uno nuevo. No cuelga de `{tagId}` porque el id del valor
        es único en toda la taxonomía del club.
      operationId: renombrarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      requestBody:
        $ref: '#/components/requestBodies/TagValueLabelBody'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/valores/{valorId}/impacto-archivado:
    get:
      summary: Impacto de archivar un valor, antes de confirmarlo
      description: |
        Cuántos alumnos tienen asignado el valor (informativo: archivar no toca esas asignaciones,
        ADR-0002 D10) y qué grupos vivos lo exigen en su filtro (bloqueante: archivar un valor
        requerido por un grupo vivo se rechaza con 409). Solo el ADMIN — misma autorización que
        archivar, del que es el paso previo.
      operationId: impactoArchivadoValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '200':
          $ref: '#/components/responses/ImpactoArchivado'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /taxonomia/valores/archivados/{valorId}:
    put:
      summary: Archivar un valor de la taxonomía
      description: |
        Mete el valor en la colección de archivados (soft-delete). Las asignaciones existentes se
        conservan; el valor deja de ofrecerse para nuevas y libera su literal dentro del eje. Solo
        el ADMIN. `PUT` es idempotente: re-archivar conserva la marca original.

        Se rechaza con 409 si el valor es requerido por el filtro de un grupo vivo (ADR-0002 D10,
        "reglas de bloqueo"): el admin debe reescribir el filtro del grupo primero. `GET
        .../impacto-archivado` da esa lista antes de intentarlo.
      operationId: archivarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Reactivar un valor archivado
      description: |
        Saca el valor de la colección de archivados. Solo el ADMIN. Se permite **aunque su eje siga
        archivado** —el archivado no tiene cascada—, pero mientras el eje lo esté el valor no se
        ofrece para asignar. Devuelve 409 si su literal fue reocupado por otro valor activo del
        mismo eje.
      operationId: reactivarValor
      tags: [taxonomia]
      parameters:
        - $ref: '#/components/parameters/ValorTagId'
      responses:
        '200':
          $ref: '#/components/responses/ValorActual'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos:
    get:
      summary: Listar los grupos del club
      description: |
        Devuelve todos los grupos del club con su filtro y cuántos alumnos caen dentro **ahora mismo**.
        El ADMIN o el ENTRENADOR; hoy ambos ven los mismos grupos, porque todavía no existe la
        asignación de entrenadores a grupos.

        `totalAlumnos` se recalcula en cada consulta —no es un contador guardado— y tiene en cuenta
        tanto el filtro de tags como las excepciones manuales de pertenencia. Un grupo cuyo filtro no
        encaja con nadie sale con `0`, que es un estado normal y visible en la pantalla.

        `valores` trae solo los identificadores: el rótulo de cada eje y de cada valor lo compone el
        cliente con la taxonomía, que ya conoce.
      operationId: listarGrupos
      tags: [grupos]
      responses:
        '200':
          $ref: '#/components/responses/GruposListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Crear un grupo del club
      description: |
        Crea un grupo: un nombre más el conjunto de valores de la taxonomía que un alumno debe tener
        **todos** para pertenecer a él. Solo AND: sin disyunción ni negación. El ADMIN o el
        ENTRENADOR.

        Los valores se validan contra la taxonomía del club: uno desconocido o de otro club devuelve
        404; uno archivado —o cuyo eje esté archivado— devuelve 409, porque un filtro nuevo no puede
        apoyarse en algo que ya no se asigna.

        `valores` vacío es válido: un grupo sin tags requeridos no es "todo el club", es un grupo al
        que solo se entra por inclusión manual. El nombre no se normaliza ni se exige único: dos
        grupos pueden llamarse igual.
      operationId: crearGrupo
      tags: [grupos]
      requestBody:
        $ref: '#/components/requestBodies/CreateGroupBody'
      responses:
        '201':
          $ref: '#/components/responses/GrupoCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos/miembros:
    get:
      summary: Previsualizar los alumnos que cumplirían un filtro de tags
      description: |
        Devuelve los alumnos del club que tienen **todos** los valores indicados, sin que el grupo
        exista todavía: es lo que alimenta el contador y la lista del constructor de grupos mientras
        se añaden y quitan condiciones. El ADMIN o el ENTRENADOR.

        `tagValueId` es repetible y se acumula en AND. Sin ningún `tagValueId` devuelve 0 alumnos —el
        mismo criterio que un grupo ya guardado sin tags requeridos—, nunca el club entero.

        Valida el filtro igual que el alta (404 y 409), para no ofrecer un filtro que el alta
        rechazaría después. No se pagina ni se trunca: el dimensionado previsto es de un par de
        cientos de alumnos por club.
      operationId: previsualizarMiembrosDeGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/TagValueIdFiltro'
      responses:
        '200':
          $ref: '#/components/responses/MiembrosPrevisualizados'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos/{grupoId}:
    get:
      summary: Consultar un grupo con sus miembros y sus excepciones manuales
      description: |
        Devuelve el grupo, quién pertenece a él **ahora mismo** y por qué, y a quién se ha sacado a
        mano. El ADMIN o el ENTRENADOR.

        Cada miembro trae su `origen`: `FILTRO` si cumple todos los tags requeridos,
        `INCLUSION_MANUAL` si está solo porque alguien lo metió a mano. El origen **se recalcula en
        cada consulta**: quien tenga excepción de inclusión y además cumpla el filtro sale como
        `FILTRO`, y pasará solo a `INCLUSION_MANUAL` el día que pierda el tag, sin que nadie escriba
        nada. Para saber si hay excepción que se pueda quitar está `ajusteManual`, que es
        independiente del origen.

        `excluidos` son alumnos sacados a mano: **no** son miembros y no cuentan en `total`.
        `cumpleFiltro` distingue la exclusión que muerde de la que hoy no cambia nada.

        404 si el grupo no existe o es de otro club: las dos situaciones dan la misma respuesta, para
        no permitir enumerar grupos ajenos.
      operationId: consultarGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
      responses:
        '200':
          $ref: '#/components/responses/GrupoDetalle'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos/{grupoId}/overrides/{alumnoId}:
    put:
      summary: Ajustar a mano la pertenencia de un alumno a un grupo
      description: |
        Mete o saca a un alumno de un grupo **sin tocar sus tags**, para gestionar excepciones sin
        ensuciar la taxonomía. El ADMIN o el ENTRENADOR.

        `incluido: true` lo mete aunque no cumpla el filtro; `incluido: false` lo saca aunque lo
        cumpla. La excepción **prevalece sobre cambios posteriores de los tags del alumno**: no se
        recalcula ni se pierde, solo se quita a mano con el DELETE.

        Idempotente: repetir la misma llamada deja el mismo estado, y llamarla con el valor contrario
        voltea la excepción sin necesidad de borrarla antes. Devuelve el detalle del grupo ya
        recalculado, para no obligar a una segunda consulta.

        404 si el grupo no existe o es de otro club, y también si el alumno no existe, es de otro
        club o no es alumno.
      operationId: ajustarPertenenciaAGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
        - $ref: '#/components/parameters/AlumnoIdEnGrupo'
      requestBody:
        $ref: '#/components/requestBodies/GroupOverrideBody'
      responses:
        '200':
          $ref: '#/components/responses/GrupoDetalle'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Quitar el ajuste manual y devolver al alumno al filtro
      description: |
        Borra la excepción: a partir de ahí, que el alumno pertenezca o no al grupo lo decide otra vez
        el filtro de tags. El ADMIN o el ENTRENADOR.

        Idempotente: devuelve 204 tanto si había excepción como si no. No comprueba el alumno —una
        excepción de alguien que ya no existe o que dejó de ser alumno tiene que poder limpiarse—, así
        que el 404 solo aparece si el grupo no existe o es de otro club.
      operationId: quitarAjusteDePertenencia
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
        - $ref: '#/components/parameters/AlumnoIdEnGrupo'
      responses:
        '204':
          description: Ajuste manual quitado (o no había ninguno)
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos/{grupoId}/entrenadores:
    get:
      summary: Consultar los entrenadores asignados a un grupo
      description: |
        Devuelve los entrenadores que llevan este grupo. Es la relación que gobernará quién puede
        publicarle un plan cuando exista el módulo Planificación (todavía no existe: hoy esta lectura
        es informativa). El ADMIN o el ENTRENADOR — leer quién lleva un grupo no es más sensible que
        leer el grupo mismo.

        404 si el grupo no existe o es de otro club: las dos situaciones dan la misma respuesta, para
        no permitir enumerar grupos ajenos.
      operationId: consultarEntrenadoresDeGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresDeGrupo'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /grupos/{grupoId}/entrenadores/{entrenadorId}:
    put:
      summary: Asignar un entrenador a un grupo
      description: |
        Vincula al entrenador con el grupo. Solo el **ADMIN** — a diferencia de las excepciones
        manuales de alumnos (`GROUP:UPDATE`, ADMIN y ENTRENADOR), esta relación decidirá quién puede
        publicar planes al grupo, así que el entrenador no puede concedérsela a sí mismo.

        Idempotente: asignar dos veces dado el mismo par deja el mismo estado. Sin body: la
        asignación no tiene atributos propios, solo existe o no existe.

        404 si el grupo no existe o es de otro club, y también si el entrenador no existe, es de
        otro club o no es entrenador.
      operationId: asignarEntrenadorAGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
        - $ref: '#/components/parameters/EntrenadorIdEnGrupo'
      responses:
        '200':
          $ref: '#/components/responses/EntrenadoresDeGrupo'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Quitar a un entrenador de un grupo
      description: |
        Desvincula al entrenador del grupo. Solo el **ADMIN**, mismo motivo que el PUT.

        Idempotente: devuelve 204 tanto si estaba asignado como si no. No comprueba que el
        entrenador siga existiendo —una asignación de quien ya no existe es justo la que hay que
        poder limpiar—, así que el 404 solo aparece si el grupo no existe o es de otro club.
      operationId: quitarEntrenadorDeGrupo
      tags: [grupos]
      parameters:
        - $ref: '#/components/parameters/GrupoIdPath'
        - $ref: '#/components/parameters/EntrenadorIdEnGrupo'
      responses:
        '204':
          description: Entrenador desvinculado del grupo (o no estaba asignado)
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /planes:
    get:
      summary: Listar los planes en borrador de un grupo
      description: |
        Devuelve los planes semanales en estado BORRADOR de un grupo, ordenados por semana. El
        ENTRENADOR con relación con el grupo. No trae sesiones ni personalizaciones —solo id, semana
        y estado—: es el listado que alimenta "mis planes en borrador por grupo", no el detalle.

        `grupoId` inexistente o ajeno al entrenador devuelve una lista vacía, no 404: este módulo solo
        conoce su propia proyección de pertenencia, no si el grupo existe de verdad en `club_taxonomia`.
      operationId: listarPlanesEnBorrador
      tags: [planes]
      parameters:
        - name: grupoId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
      responses:
        '200':
          $ref: '#/components/responses/PlanesListados'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    post:
      summary: Crear un plan semanal en borrador
      description: |
        Crea un plan en borrador para un grupo. Solo el ENTRENADOR, y solo si tiene relación con ese
        grupo (asignación de LAL-93) — un entrenador sin relación con el grupo recibe 403, igual que
        si el grupo no existiera: este módulo no distingue ambos casos.

        `semana` debe ser el lunes de la semana del plan; cualquier otro día devuelve 400.
      operationId: crearPlanEnBorrador
      tags: [planes]
      requestBody:
        $ref: '#/components/requestBodies/CreatePlanBody'
      responses:
        '201':
          $ref: '#/components/responses/PlanCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /planes/{planId}:
    get:
      summary: Consultar el detalle de un plan, con sus sesiones
      description: |
        Devuelve el plan completo con sus sesiones (LAL-24, editor de sesión) — a diferencia de
        `GET /planes`, que solo trae el resumen del listado. Solo el ENTRENADOR con relación con el
        grupo del plan; sin relación (o plan inexistente / de otro club) da 403, no 404: este módulo
        no distingue ambos casos, igual que en `POST /planes`.
      operationId: consultarPlan
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PlanDetalle'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /planes/{planId}/sesiones:
    post:
      summary: Añadir una sesión al plan
      description: |
        Crea una sesión para un día concreto de la semana del plan (AC1/AC3 de LAL-24: tipo, volumen
        —distancia o tiempo, nunca los dos—, ritmo y notas). `tipo` sale del catálogo cerrado del
        glosario; `DESCANSO` no admite `volumen` ni `ritmo`.

        En el MVP el ritmo solo se introduce como `ABSOLUTO` (AC2) — el modelo ya admite `RELATIVO`
        porque el dominio lo soporta desde LAL-114, pero la UI de LAL-27 es quien lo activará.

        `dia` debe caer dentro de la semana del plan (400) y no puede coincidir con el de otra sesión
        ya creada (409, una sesión por día). Solo el ENTRENADOR con relación vigente con el grupo del
        plan (403 si no, igual que al crearlo).
      operationId: anadirSesion
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
      requestBody:
        $ref: '#/components/requestBodies/SessionBody'
      responses:
        '201':
          $ref: '#/components/responses/SesionCreada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /planes/{planId}/sesiones/{sesionId}:
    put:
      summary: Editar tipo, volumen, ritmo y notas de una sesión
      description: |
        Sustituye tipo, volumen, ritmo y notas de una sesión existente. **Sin `dia`**: el editor no
        permite mover una sesión de día — para eso se borra y se crea otra. 404 si la sesión no
        existe en el plan.
      operationId: editarSesion
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
        - $ref: '#/components/parameters/SesionIdPath'
      requestBody:
        $ref: '#/components/requestBodies/SessionUpdateBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionActualizada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Eliminar una sesión del plan
      description: Elimina la sesión. 404 si no existe en el plan.
      operationId: eliminarSesion
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
        - $ref: '#/components/parameters/SesionIdPath'
      responses:
        '204':
          description: Sesión eliminada
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /planes/{planId}/publicacion:
    post:
      summary: Publicar el plan semanal a su grupo
      description: |
        Publica el plan (LAL-25): pasa a `PUBLICADO`, congela el snapshot de alumnos resueltos en ese
        momento (ADR-0002 D5, `plan_snapshot_alumno`) y emite `PlanPublicado`. A partir de aquí el
        plan deja de aceptar sesiones nuevas ni ediciones — 409 `PLAN_ALREADY_PUBLISHED` en ese caso,
        igual que al intentar publicarlo dos veces.

        Un plan sin ninguna sesión no se puede publicar (409 `PLAN_WITHOUT_SESSIONS`): publicar una
        semana en blanco es siempre un error del entrenador. Solo el ENTRENADOR con relación vigente
        con el grupo del plan (403, mismo criterio que el resto de operaciones sobre el plan).

        Si la proyección de membresía del grupo está atrasada más de lo tolerable (ADR-0009 D9,
        fail-closed a 60 s), devuelve 503 `PROJECTION_STALE`: publicar ahora arriesgaría un snapshot
        incompleto. Es un estado transitorio — reintentar en unos segundos suele resolverlo.
      operationId: publicarPlan
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PlanPublicado'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'

  /planes/{planId}/sesiones/{sesionId}/personalizaciones/{alumnoId}:
    put:
      summary: Aplicar o sustituir la personalización de un alumno en una sesión
      description: |
        Crea o sustituye el override de esta sesión para este alumno (LAL-26): reemplazo completo de
        tipo/volumen/ritmo/notas, nunca combina campo a campo con la sesión base. Única por
        (plan, sesión, alumno) — repetir la llamada sustituye el override anterior, no lo acumula.

        Permitido tanto con el plan en `BORRADOR` como ya `PUBLICADO` (a diferencia de las
        operaciones sobre sesiones, que la publicación congela): personalizar un plan ya publicado es
        el caso de uso principal. `alumnoId` debe pertenecer al grupo del plan si está en `BORRADOR`,
        o estar en su snapshot congelado si ya está `PUBLICADO` (409 `STUDENT_NOT_IN_PLAN` si no).

        Devuelve el plan completo recalculado, para no obligar a una segunda consulta (mismo criterio
        que `ajustarPertenenciaAGrupo`). Solo el ENTRENADOR con relación vigente con el grupo del plan.

        404 si la sesión no existe en el plan (`SESSION_NOT_FOUND`).
      operationId: aplicarPersonalizacion
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
        - $ref: '#/components/parameters/SesionIdPath'
        - $ref: '#/components/parameters/AlumnoIdPersonalizado'
      requestBody:
        $ref: '#/components/requestBodies/PersonalizationBody'
      responses:
        '200':
          $ref: '#/components/responses/PlanDetalle'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '500':
          $ref: '#/components/responses/ErrorServerError'
    delete:
      summary: Retirar la personalización de un alumno en una sesión
      description: |
        Retira el override, si existía. A diferencia de `quitarAjusteDePertenencia` (que es 204
        siempre, aunque no hubiera nada), aquí se distingue: 404 `PERSONALIZATION_NOT_FOUND` si el
        alumno no tenía personalización en esa sesión. Solo el ENTRENADOR con relación vigente con el
        grupo del plan.
      operationId: retirarPersonalizacion
      tags: [planes]
      parameters:
        - $ref: '#/components/parameters/PlanIdPath'
        - $ref: '#/components/parameters/SesionIdPath'
        - $ref: '#/components/parameters/AlumnoIdPersonalizado'
      responses:
        '204':
          description: Personalización retirada
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorServerError'

  /auditoria/eventos:
    get:
      summary: Consulta forense del log de auditoría de autorización
      description: |
        Lista los asientos de `auditoria.evento` del club (ADR-0009 D15-D17): denegaciones de
        autorización (`ACCESO_DENEGADO`) y accesos a datos sensibles (`ACCESO_DATOS_SENSIBLES`), del
        más reciente al más antiguo. Solo ADMIN.

        Sin paginación todavía — devuelve como mucho los 500 asientos más recientes que cumplan el
        filtro; se amplía si el volumen real lo exige.
      operationId: listarEventosDeAuditoria
      tags: [auditoria]
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sujetoId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [ACCESO_DENEGADO, ACCESO_DATOS_SENSIBLES]
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          $ref: '#/components/responses/EventosDeAuditoriaListados'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Sesión autenticada por cookie httpOnly first-party (Spring Session). El navegador la adjunta
        automáticamente; el cliente nunca la lee ni la envía a mano. Los endpoints de entrada anónima
        (login, activación, magic link, reseteo) no la requieren (security: []).

  headers:
    RetryAfter:
      description: Segundos recomendados antes de reintentar
      schema:
        type: integer

  parameters:
    EntrenadorId:
      name: id
      in: path
      required: true
      description: ID del entrenador
      schema:
        type: string
        format: uuid

    AlumnoId:
      name: id
      in: path
      required: true
      description: ID del alumno
      schema:
        type: string
        format: uuid

    UsuarioId:
      name: id
      in: path
      required: true
      description: ID del usuario
      schema:
        type: string
        format: uuid

    TagId:
      name: tagId
      in: path
      required: true
      description: ID del eje de la taxonomía
      schema:
        $ref: '#/components/schemas/TagKeyId'

    ValorTagId:
      name: valorId
      in: path
      required: true
      description: ID del valor de la taxonomía (único en todo el club, no solo dentro de su eje)
      schema:
        $ref: '#/components/schemas/TagValueId'

    GrupoIdPath:
      name: grupoId
      in: path
      required: true
      description: ID del grupo del club
      schema:
        $ref: '#/components/schemas/GroupId'

    AlumnoIdEnGrupo:
      name: alumnoId
      in: path
      required: true
      description: ID del alumno sobre el que se ajusta la pertenencia al grupo
      schema:
        type: string
        format: uuid

    EntrenadorIdEnGrupo:
      name: entrenadorId
      in: path
      required: true
      description: ID del entrenador sobre el que se ajusta la asignación al grupo
      schema:
        type: string
        format: uuid

    PlanIdPath:
      name: planId
      in: path
      required: true
      description: ID del plan semanal
      schema:
        $ref: '#/components/schemas/PlanId'

    SesionIdPath:
      name: sesionId
      in: path
      required: true
      description: ID de la sesión dentro del plan
      schema:
        $ref: '#/components/schemas/TrainingSessionId'

    AlumnoIdPersonalizado:
      name: alumnoId
      in: path
      required: true
      description: ID del alumno del grupo sobre el que se aplica o retira la personalización
      schema:
        type: string
        format: uuid

    TagValueIdFiltro:
      name: tagValueId
      in: query
      required: false
      style: form
      explode: true
      description: |
        Valor de la taxonomía que el alumno debe tener para entrar en el grupo. Repetible
        (`?tagValueId=a&tagValueId=b`); los valores se acumulan en AND, nunca en OR. Ausente equivale
        a filtro vacío, que devuelve 0 alumnos.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TagValueId'

    TagValueIdFiltroAlumnos:
      name: tagValueId
      in: query
      required: false
      style: form
      explode: true
      description: |
        Valor de la taxonomía que el alumno debe tener para aparecer en el listado. Repetible
        (`?tagValueId=a&tagValueId=b`); los valores se acumulan en AND, nunca en OR. **Ausente
        equivale a sin filtro: devuelve todos los alumnos del club** — semántica distinta de
        `TagValueIdFiltro`, cuya ausencia da 0 alumnos porque simula un grupo aún no creado.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TagValueId'

    DiaReajustadoPath:
      name: dia
      in: path
      required: true
      description: Día EFECTIVO de la sesión que se reajusta (YYYY-MM-DD, LAL-33)
      schema:
        type: string
        format: date

    DiaReporteadoPath:
      name: dia
      in: path
      required: true
      description: Día de la sesión que se reporta (YYYY-MM-DD)
      schema:
        type: string
        format: date

    DistanciaMarcaPath:
      name: distancia
      in: path
      required: true
      description: Distancia estándar de la marca (LAL-31)
      schema:
        type: string
        enum: ['5K', '10K', '21K', '42K']

  requestBodies:
    InviteCoachBody:
      description: Datos necesarios para dar de alta un entrenador
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachRequest'

    InviteStudentBody:
      description: Datos necesarios para dar de alta un alumno
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentRequest'

    ActivationBody:
      description: Token de invitación y contraseña elegida
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationRequest'

    CredentialsBody:
      description: Email y contraseña para iniciar sesión
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialsRequest'

    PasswordChangeBody:
      description: Email, contraseña caducada y contraseña nueva (cambio forzado)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeRequest'

    MagicLinkBody:
      description: Email para el que se solicita el magic link
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkRequest'

    MagicLinkConsumeBody:
      description: Token del magic link a consumir
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MagicLinkConsumeRequest'

    PasswordResetBody:
      description: Email para el que se solicita el reseteo de contraseña
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'

    PasswordResetConsumeBody:
      description: Token del reseteo y contraseña nueva
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetConsumeRequest'

    ClubPatchBody:
      description: Nombre nuevo del club
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubPatchRequest'

    TagKeyLabelBody:
      description: |
        Nombre del eje. El alta y el renombrado comparten cuerpo porque la forma y la semántica son
        idénticas; duplicar el esquema solo por el verbo sería ruido.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyLabelRequest'

    TagValueLabelBody:
      description: Literal del valor, para crearlo o renombrarlo dentro de su eje
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueLabelRequest'

    StudentTagsBody:
      description: Conjunto completo de valores que debe tener el alumno tras la operación
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentTagsRequest'

    StudentTagAssignmentBody:
      description: Valor que se añade a la clasificación que el alumno ya tiene
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentTagAssignmentRequest'

    CreateGroupBody:
      description: Nombre del grupo y conjunto de valores de la taxonomía que define su membresía
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateGroupRequest'

    GroupOverrideBody:
      description: Sentido del ajuste manual — dentro del grupo o fuera de él
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupOverrideRequest'

    CreatePlanBody:
      description: Grupo y semana del plan en borrador
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePlanRequest'

    SessionBody:
      description: Día, tipo, volumen, ritmo y notas de la sesión a crear
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingSessionRequest'

    SessionUpdateBody:
      description: Tipo, volumen, ritmo y notas de la sesión — sin día, que no se puede mover
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingSessionUpdateRequest'

    PersonalizationBody:
      description: Override completo de la sesión para el alumno, más el mensaje opcional
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalizationRequest'

    MiReajusteBody:
      description: Acción, día destino, motivo y resolución de conflicto del reajuste de día
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiReajusteRequest'

    MiReporteBody:
      description: Estado, valoración, motivo y notas del reporte de sesión
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiReporteRequest'

    ConcederConsentimientoBody:
      description: Versión del texto de consentimiento que se concede
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiConsentimientoRequest'

    MiMarcaBody:
      description: Tiempo de la marca, en segundos
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiMarcaRequest'

  responses:
    EntrenadorCreado:
      description: Entrenador creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachResponse'

    EntrenadoresListados:
      description: Lista de entrenadores del club
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CoachSummary'

    EntrenadoresResumenListados:
      description: Entrenadores del club con su carga (grupos asignados y alumnos que suman)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CoachWorkloadsResponse'

    AlumnoCreado:
      description: Alumno creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentResponse'

    AlumnosListados:
      description: Alumnos del club con su estado y sus tags
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentsResponse'

    CuentaActivada:
      description: Cuenta activada; sesión iniciada (cookie httpOnly)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationResponse'

    SesionIniciada:
      description: Sesión iniciada; cookie de sesión httpOnly establecida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'

    InvitacionReemitida:
      description: Nueva invitación emitida; la anterior queda invalidada

    SesionesRevocadas:
      description: Sesiones del usuario revocadas

    CuentaDesactivada:
      description: Cuenta desactivada; sus sesiones activas quedan revocadas

    UsuarioEliminado:
      description: |
        Usuario eliminado con sus datos personales; sus sesiones quedan revocadas y la baja se
        propaga al resto de módulos. La operación es irreversible

    SesionCerrada:
      description: Sesión cerrada

    ContrasenaCaducada:
      description: |
        Contraseña caducada. Cuerpo ErrorResponse con `code=PASSWORD_EXPIRED`; no se crea sesión.
        El cliente debe llevar al cambio obligatorio (POST /sesion/contrasena).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PASSWORD_EXPIRED
            message: La contraseña ha caducado

    MagicLinkSolicitado:
      description: |
        Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace. Respuesta
        neutra: idéntica exista o no la cuenta, para no revelar si un email está registrado.

    ReseteoSolicitado:
      description: |
        Aceptado. Si el email corresponde a una cuenta activa, se ha enviado un enlace para
        restablecer la contraseña. Respuesta neutra: idéntica exista o no la cuenta, para no
        revelar si un email está registrado.

    MisPermisos:
      description: Permisos concedidos al rol del principal actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionsResponse'

    ClubActual:
      description: Ficha del club
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubResponse'

    ErrorBadRequest:
      description: Entrada inválida (campo requerido vacío, formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_INPUT
            field: email
            message: El email no tiene un formato válido

    ErrorUnauthorized:
      description: No autenticado; la sesión ha expirado o no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: No autenticado

    ErrorForbidden:
      description: El principal no tiene permiso (cuerpo neutro sin detalles)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Acceso denegado

    ErrorNotFound:
      description: Recurso no encontrado o no pertenece al club del principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado

    ErrorConflict:
      description: La operación choca con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CONFLICT
            message: Ya existe un usuario con ese email en el club

    ErrorTooManyRequests:
      description: |
        Límite de rate-limiting alcanzado. Cuerpo ErrorResponse con `code=RATE_LIMITED` y cabecera
        `Retry-After` (segundos). Los flujos anónimos de magic link y reseteo NO devuelven 429:
        mantienen su 202 neutro para no revelar que se alcanzó un límite.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Has superado el límite de peticiones; inténtalo de nuevo más tarde

    ErrorServerError:
      description: |
        Error interno del servidor (red de seguridad de GlobalRestExceptionHandler). Cuerpo
        ErrorResponse con `code=INTERNAL_ERROR` y mensaje neutro: el detalle del fallo va al log,
        nunca al body. Puede devolverlo cualquier endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Ha ocurrido un error inesperado

    ErrorServiceUnavailable:
      description: |
        Indisponibilidad temporal, distinta de un error del cliente: la operación es correcta pero no
        se puede completar ahora con garantías (ej. `PROJECTION_STALE`, ADR-0009 D9). Reintentar en
        unos segundos suele resolverlo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PROJECTION_STALE
            message: La membresía del grupo está desactualizada; inténtalo de nuevo en unos segundos

    TaxonomiaActual:
      description: Taxonomía completa del club, con sus ejes archivados incluidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaxonomyResponse'

    TagCreado:
      description: Eje creado en la taxonomía del club
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyResponse'

    TagActual:
      description: Estado del eje después de la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagKeyResponse'

    ValorCreado:
      description: Valor creado dentro del eje
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueResponse'

    ValorActual:
      description: Estado del valor después de la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagValueResponse'

    ImpactoArchivado:
      description: Impacto de archivar el eje o valor, antes de confirmarlo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImpactoArchivadoResponse'

    TagsDelAlumno:
      description: Clasificación completa del alumno después de la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentTagsResponse'

    TagDesasignado:
      description: El alumno ya no tiene ese valor asignado

    GruposListados:
      description: Grupos del club con su filtro y su número de alumnos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupsResponse'

    GrupoCreado:
      description: Grupo creado, con el filtro de tags que define su membresía
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupResponse'

    MiembrosPrevisualizados:
      description: Alumnos que cumplen el filtro de tags indicado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupMembersResponse'

    GrupoDetalle:
      description: Grupo con sus miembros —y por qué lo son— y sus exclusiones manuales
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupDetailResponse'

    EntrenadoresDeGrupo:
      description: Entrenadores asignados al grupo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupCoachesResponse'

    PlanCreado:
      description: Plan semanal creado en estado BORRADOR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanResponse'

    PlanesListados:
      description: Planes en borrador del grupo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanesResponse'

    PlanDetalle:
      description: Plan semanal completo, con sus sesiones
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanDetalleResponse'

    SesionCreada:
      description: Sesión creada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingSessionResponse'

    SesionActualizada:
      description: Sesión después de la edición
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrainingSessionResponse'

    PlanPublicado:
      description: El plan tras publicarse, con el tamaño del snapshot congelado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicacionResponse'

    EventosDeAuditoriaListados:
      description: Asientos del log de auditoría que cumplen el filtro, del más reciente al más antiguo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditEventsResponse'

    MiSemanaResuelta:
      description: La semana del propio alumno, ya resuelta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiPlanSemanalResponse'

    AlertasListadas:
      description: Alertas activas del entrenador sobre sus alumnos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertasResponse'

    MiSesionReportada:
      description: La sesión del día, con el reporte recién enviado ya aplicado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiResolvedSessionResponse'

    MiReajusteAplicado:
      description: |
        El reajuste ya aplicado a la sesión de origen. No es la sesión completa: tras un `MOVIDA` la
        sesión desaparece de este día, así que el cliente recarga la semana (`GET /me/plan`) en vez de
        confiar en este cuerpo para repintar la vista.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiReajusteResponse'

    MiConsentimiento:
      description: El propio estado de consentimiento de datos de salud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiConsentimientoResponse'

    MisMarcas:
      description: Las cuatro marcas del propio alumno, en orden fijo 5K/10K/21K/42K
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MisMarcasResponse'

    MiMarca:
      description: La marca ya guardada de una distancia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiMarcaResponse'

  schemas:
    InviteCoachRequest:
      type: object
      description: Datos necesarios para dar de alta un entrenador por invitación
      required: [nombre, email]
      properties:
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'

    InviteCoachResponse:
      type: object
      description: Respuesta al alta del entrenador
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b

    CoachSummary:
      type: object
      description: Vista de lectura de un entrenador para el listado admin
      required: [id, nombre, email, estado]
      properties:
        id:
          type: string
          format: uuid
          description: ID del entrenador
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'
        estado:
          type: string
          enum: [INVITADO, ACTIVO, DESACTIVADO]
          description: Estado de la cuenta
          example: ACTIVO

    CoachWorkloadsResponse:
      type: object
      description: |
        Entrenadores del club con su carga, ordenados por nombre. Envuelto en objeto para poder
        añadir más adelante contadores de resumen de la pantalla sin romper el contrato.
      required: [entrenadores]
      properties:
        entrenadores:
          type: array
          items:
            $ref: '#/components/schemas/CoachWorkloadResponse'

    CoachWorkloadResponse:
      type: object
      description: |
        Un entrenador tal como se pinta en el listado de club: su estado y los grupos que lleva.
        A diferencia de `CoachSummary` (gestión de sesión, en `identidad`), el estado aquí solo tiene
        dos valores — esta vista lee de la proyección local de club y taxonomía, que no consume el
        evento de desactivación.
      required: [id, nombre, email, estado, grupos, totalAlumnos]
      properties:
        id:
          type: string
          format: uuid
          description: ID del entrenador
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'
        estado:
          type: string
          enum: [INVITADO, ACTIVO]
          description: Estado de la cuenta en la proyección local del club
          example: ACTIVO
        grupos:
          type: array
          items:
            $ref: '#/components/schemas/CoachGroupResponse'
        totalAlumnos:
          type: integer
          format: int32
          minimum: 0
          description: |
            Alumnos **distintos** que caen bajo la carga de este entrenador. No es la suma de
            `totalAlumnos` de cada grupo: un alumno que está en dos de los grupos de este entrenador
            cuenta una vez, porque la carga mide personas, no matrículas.
          example: 0

    CoachGroupResponse:
      type: object
      description: Un grupo que lleva un entrenador, con cuántos alumnos suma
      required: [id, nombre, totalAlumnos]
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        nombre:
          $ref: '#/components/schemas/GroupName'
        totalAlumnos:
          type: integer
          format: int32
          minimum: 0
          example: 0

    InviteStudentRequest:
      type: object
      description: Datos necesarios para dar de alta un alumno por invitación
      required: [nombre, email]
      properties:
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'

    InviteStudentResponse:
      type: object
      description: Respuesta al alta del alumno
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b

    Email:
      type: string
      format: email
      maxLength: 254
      description: Dirección de email del usuario (identificador único dentro del club)
      example: usuario@club.es

    Nombre:
      type: string
      minLength: 1
      maxLength: 200
      description: Nombre completo de la persona
      example: Ana García

    NombreClub:
      type: string
      minLength: 1
      maxLength: 200
      description: Nombre del club
      example: Club Atletismo Central

    Token:
      type: string
      minLength: 1
      maxLength: 512
      description: Token de un solo uso recibido por email (invitación, magic link o reseteo)
      example: 8Kq2mZ7pR4tV9wX1yB6nC3dF5gH0jL

    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: Contraseña nueva; política de contraseña (12–128 caracteres, sin datos personales, no reutilizada)

    ActivationRequest:
      type: object
      description: |
        Datos para activar la cuenta por invitación. `consentimiento`/`versionConsentimiento`
        (LAL-128) solo son obligatorios cuando el invitado es ALUMNO: es el único interesado de los
        datos de salud del art. 9 RGPD que captura `seguimiento.reporte_sesion`. El backend los
        ignora para ADMIN/ENTRENADOR. `versionConsentimiento` debe coincidir con la versión vigente
        del texto (400 `CONSENTIMIENTO_REQUERIDO` sin casilla marcada; 409
        `VERSION_CONSENTIMIENTO_OBSOLETA` con una versión que ya no es la vigente).
      required: [token, password]
      properties:
        token:
          $ref: '#/components/schemas/Token'
        password:
          $ref: '#/components/schemas/Password'
        consentimiento:
          type: boolean
          description: Casilla de consentimiento de datos de salud, no premarcada. Solo aplica a ALUMNO.
        versionConsentimiento:
          type: string
          description: Versión del texto de consentimiento mostrado al marcar la casilla.

    ActivationResponse:
      description: Sesión iniciada tras la activación (mismo shape que la sesión de login)
      allOf:
        - $ref: '#/components/schemas/SessionResponse'

    CredentialsRequest:
      type: object
      description: Credenciales de login con contraseña
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          description: Contraseña en claro (se verifica contra el hash Argon2id)
          minLength: 1
          maxLength: 128

    SessionResponse:
      type: object
      description: Sesión iniciada; nunca incluye datos sensibles ni el hash de la contraseña
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        clubId:
          type: string
          format: uuid
          example: 018f9a2b-9f8e-7d6c-b5a4-3210fedcba98
        role:
          type: string
          enum: [ADMIN, ENTRENADOR, ALUMNO]
          description: Rol del usuario
          example: ENTRENADOR

    PermissionsResponse:
      type: object
      description: |
        Mapa `{ recurso: [acciones] }`. Las claves son los recursos protegidos por la matriz (COACH,
        STUDENT, USER, CLUB, TAXONOMY, GROUP); cada valor es la lista de acciones concedidas al rol
        del principal actual sobre ese recurso. Un recurso sin acciones concedidas no aparece en el
        mapa.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        COACH: [INVITE, LIST]
        STUDENT: [INVITE, CLASSIFY, LIST]
        USER: [REVOKE_SESSIONS, DEACTIVATE, DELETE]
        CLUB: [UPDATE]
        TAXONOMY: [MANAGE, LIST]
        GROUP: [CREATE, LIST, UPDATE, ASSIGN_COACH]

    ClubResponse:
      type: object
      description: Ficha del club
      required: [id, nombre]
      properties:
        id:
          type: string
          format: uuid
          example: 018f9a2b-9f8e-7d6c-b5a4-3210fedcba98
        nombre:
          $ref: '#/components/schemas/NombreClub'
        slug:
          type: string
          nullable: true
          description: |
            Identificador corto de solo lectura; aún sin uso (el enrutado por subdominio es multi-club).
            En el MVP siempre llega vacío: ningún club tiene slug asignado todavía.
          example: club-atletismo-central

    ClubPatchRequest:
      type: object
      description: Datos editables de la ficha del club. En el MVP, solo el nombre.
      required: [nombre]
      properties:
        nombre:
          $ref: '#/components/schemas/NombreClub'

    PasswordChangeRequest:
      type: object
      description: |
        Cambio forzado de contraseña caducada. Revalida la contraseña actual (la caducada que el
        usuario tecleó) y fija la nueva; al lograrlo, inicia sesión.
      required: [email, currentPassword, newPassword]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        currentPassword:
          type: string
          format: password
          description: Contraseña actual (caducada) para revalidar la identidad
          minLength: 1
          maxLength: 128
        newPassword:
          $ref: '#/components/schemas/Password'

    MagicLinkRequest:
      type: object
      description: Email para el que se solicita un magic link de login
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    MagicLinkConsumeRequest:
      type: object
      description: Token del magic link recibido en el email (un solo uso, 15 min)
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/Token'

    PasswordResetRequest:
      type: object
      description: Email para el que se solicita un reseteo de contraseña
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    PasswordResetConsumeRequest:
      type: object
      description: |
        Token del reseteo recibido en el email (un solo uso, 15 min) y contraseña nueva. Al fijarla,
        el backend invalida todas las sesiones activas del usuario e inicia sesión.
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/Token'
        newPassword:
          $ref: '#/components/schemas/Password'

    TaxonomyResponse:
      type: object
      description: Taxonomía del club — el conjunto de sus ejes, cada uno con sus valores
      required: [tags]
      properties:
        tags:
          type: array
          description: Ejes de la taxonomía, activos y archivados, en orden de alta
          items:
            $ref: '#/components/schemas/TagKeyResponse'

    TagKeyResponse:
      type: object
      description: Eje de la taxonomía (nivel, objetivo, terreno…) con sus valores
      required: [id, nombre, valores]
      properties:
        id:
          $ref: '#/components/schemas/TagKeyId'
        nombre:
          $ref: '#/components/schemas/TagKeyLabel'
        archivadoEn:
          $ref: '#/components/schemas/ArchivadoEn'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueResponse'

    TagValueResponse:
      type: object
      description: Valor permitido dentro de un eje
      required: [id, valor, metadata]
      properties:
        id:
          $ref: '#/components/schemas/TagValueId'
        valor:
          $ref: '#/components/schemas/TagValueLabel'
        archivadoEn:
          $ref: '#/components/schemas/ArchivadoEn'
        metadata:
          $ref: '#/components/schemas/TagValueMetadata'

    ImpactoArchivadoResponse:
      type: object
      description: |
        Impacto de archivar un eje o un valor. `alumnosAfectados` es solo informativo — archivar no
        toca las asignaciones existentes (ADR-0002 D10). `gruposQueLoRequieren` es lo bloqueante: si
        no está vacío, el `PUT` de archivado se rechaza con 409 hasta que el admin reescriba el
        filtro de esos grupos.
      required: [alumnosAfectados, gruposQueLoRequieren]
      properties:
        alumnosAfectados:
          type: integer
          format: int32
          description: Alumnos que tienen asignado el eje/valor ahora mismo
        gruposQueLoRequieren:
          type: array
          items:
            $ref: '#/components/schemas/GrupoAfectadoPorArchivado'

    GrupoAfectadoPorArchivado:
      type: object
      required: [id, nombre, perderiaTodosLosTagsRequeridos]
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        nombre:
          $ref: '#/components/schemas/GroupName'
        perderiaTodosLosTagsRequeridos:
          type: boolean
          description: |
            `true` si todos los tags requeridos del grupo quedan dentro de lo que se va a archivar:
            el grupo se queda sin ningún filtro activo con el que ganar miembros nuevos y pasa a
            depender solo de inclusiones manuales (ADR-0002 D3/D4).

    TagKeyId:
      type: string
      format: uuid
      description: Identificador de un eje de la taxonomía
      example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b

    TagValueId:
      type: string
      format: uuid
      description: |
        Identificador de un valor de la taxonomía. Es único en todo el club, no solo dentro de su
        eje: por eso las rutas de un valor no cuelgan del eje padre.
      example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5c

    ArchivadoEn:
      type: string
      format: date-time
      nullable: true
      description: |
        Momento en que el elemento se archivó; `null` si está activo. El archivado es un
        soft-delete: el elemento se conserva y sus asignaciones también, pero deja de ofrecerse.
      example: '2026-07-28T10:15:30Z'

    TagKeyLabel:
      type: string
      minLength: 1
      maxLength: 40
      description: Nombre del eje, tal y como lo teclea el admin
      example: nivel

    TagValueLabel:
      type: string
      minLength: 1
      maxLength: 60
      description: Literal del valor, tal y como lo teclea el admin
      example: principiante

    TagKeyLabelRequest:
      type: object
      description: Nombre de un eje, para crearlo o renombrarlo
      required: [nombre]
      properties:
        nombre:
          $ref: '#/components/schemas/TagKeyLabel'

    TagValueLabelRequest:
      type: object
      description: Literal de un valor, para crearlo o renombrarlo
      required: [valor]
      properties:
        valor:
          $ref: '#/components/schemas/TagValueLabel'

    TagValueMetadata:
      description: |
        Apéndice tipado y opcional de un valor, discriminado por `tipo`. Los valores de ejes como
        `nivel` o `terreno` llevan `EMPTY`; los del eje `objetivo` (carreras) llevan `RACE` con
        fecha y distancia. El frontend lee el tipo del contrato, no lo deduce.

        Hoy es **solo de lectura**: no hay operación que asigne metadata, así que todo valor nuevo
        nace con `EMPTY`.

        La unión no declara `discriminator` a propósito. Con él, `openapi-generator` emite para
        Kotlin un `override val tipo` tipado como enum sobre una interfaz que lo declara `String`,
        y el código generado no compila. Sin él, ambos generadores producen lo correcto: una
        `sealed interface` con subtipos que serializan su propio `tipo`, y en TypeScript una unión
        discriminada con literales. El precio es que Jackson no puede **deserializar** la unión —
        irrelevante mientras la metadata sea de solo lectura, pero quien añada una operación de
        escritura tendrá que resolverlo (probablemente con un mixin en `infrastructure`, como ya se
        hace para el JSONB).
      oneOf:
        - $ref: '#/components/schemas/EmptyMetadata'
        - $ref: '#/components/schemas/RaceMetadata'

    EmptyMetadata:
      type: object
      description: Valor sin metadata
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [EMPTY]

    RaceMetadata:
      type: object
      description: Metadata de una carrera — fecha y distancia estándar
      required: [tipo, fecha, distancia]
      properties:
        tipo:
          type: string
          enum: [RACE]
        fecha:
          type: string
          format: date
          example: '2026-12-06'
        distancia:
          type: string
          enum: ['5K', '10K', '21K', '42K']
          description: Distancia estándar de la carrera
          example: 42K

    StudentTagsResponse:
      type: object
      description: |
        Valores de la taxonomía asignados hoy a un alumno. Un mismo eje puede aparecer **varias
        veces**: la relación es N-M real, así que un alumno puede tener dos objetivos o dos terrenos.

        El orden es el de la taxonomía —ejes por orden de alta, y dentro de cada eje sus valores por
        orden de alta— para que la interfaz pinte los chips siempre igual.

        Puede incluir valores archivados: archivar deja de ofrecerlos para asignaciones nuevas, pero
        conserva las que ya existían.
      required: [alumnoId, valores]
      properties:
        alumnoId:
          type: string
          format: uuid
        valores:
          type: array
          items:
            $ref: '#/components/schemas/StudentTagResponse'

    StudentTagResponse:
      type: object
      description: |
        Un valor asignado, con el eje del que cuelga. El `tagId` viaja porque el cliente no puede
        deducirlo del id del valor, y lo necesita para agrupar los chips por eje.
      required: [tagId, id, valor]
      properties:
        tagId:
          $ref: '#/components/schemas/TagKeyId'
        id:
          $ref: '#/components/schemas/TagValueId'
        valor:
          $ref: '#/components/schemas/TagValueLabel'
        archivadoEn:
          $ref: '#/components/schemas/ArchivadoEn'

    StudentsResponse:
      type: object
      description: |
        Alumnos del club, ordenados alfabéticamente por nombre. Envuelto en objeto por el mismo
        motivo que `GroupsResponse`: poder añadir contadores de resumen sin romper el contrato.
      required: [alumnos]
      properties:
        alumnos:
          type: array
          items:
            $ref: '#/components/schemas/StudentSummaryResponse'

    StudentSummaryResponse:
      type: object
      description: |
        Un alumno tal y como se pinta en el listado: su estado y **todos** los valores de taxonomía
        que tiene asignados, no solo los que coincidan con el filtro aplicado — el cliente resta o
        resalta lo que necesite con la taxonomía que ya tiene cargada.
      required: [id, nombre, email, estado, valores]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 200
          example: Pedro Cordero
        email:
          type: string
          format: email
        estado:
          type: string
          enum: [INVITADO, ACTIVO]
          description: Estado de la cuenta, reflejo del que gobierna identidad.
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'

    StudentTagsRequest:
      type: object
      description: |
        Conjunto **completo** de valores que debe tener el alumno tras la operación: lo que no
        aparezca se desasigna. Una lista vacía borra toda su clasificación. Los ids repetidos se
        colapsan — es un conjunto, no una lista.
      required: [valores]
      properties:
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'

    StudentTagAssignmentRequest:
      type: object
      description: Valor que se añade a lo que el alumno ya tenga, sin tocar el resto
      required: [valorId]
      properties:
        valorId:
          $ref: '#/components/schemas/TagValueId'

    GroupId:
      type: string
      format: uuid
      description: ID de un grupo del club
      example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5d

    GroupName:
      type: string
      minLength: 1
      maxLength: 80
      description: |
        Nombre del grupo, tal y como lo teclea quien lo crea. No se normaliza ni se exige único: dos
        grupos pueden llamarse igual.
      example: Maratón Valencia avanzado

    CreateGroupRequest:
      type: object
      description: |
        Alta de un grupo. `valores` **es** el filtro: pertenece al grupo quien tenga todos esos
        valores. Los ids repetidos se colapsan —es un conjunto— y la lista vacía se acepta.
      required: [nombre, valores]
      properties:
        nombre:
          $ref: '#/components/schemas/GroupName'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'

    GroupResponse:
      type: object
      description: Grupo tal y como queda tras crearlo; `valores` es el filtro que define su membresía
      required: [id, nombre, valores]
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        nombre:
          $ref: '#/components/schemas/GroupName'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'

    GroupsResponse:
      type: object
      description: |
        Grupos del club, ordenados alfabéticamente por nombre. Envuelto en objeto para poder añadir
        más adelante los contadores de resumen de la pantalla sin romper el contrato.
      required: [grupos]
      properties:
        grupos:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummaryResponse'

    GroupSummaryResponse:
      type: object
      description: |
        Un grupo tal y como se pinta en el listado: su filtro y cuánta gente cae dentro ahora mismo.
        No trae entrenador asignado ni última actividad: todavía no existen.
      required: [id, nombre, valores, totalAlumnos]
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        nombre:
          $ref: '#/components/schemas/GroupName'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'
        totalAlumnos:
          type: integer
          format: int32
          minimum: 0
          description: Alumnos que pertenecen al grupo en este momento, excepciones manuales incluidas
          example: 12

    GroupMembersResponse:
      type: object
      description: |
        Alumnos que cumplen un filtro de tags. `total` es el tamaño de `alumnos`, no un total
        paginado: la respuesta no se pagina ni se trunca. Vienen ordenados por nombre.
      required: [total, alumnos]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          example: 12
        alumnos:
          type: array
          items:
            $ref: '#/components/schemas/GroupMemberResponse'

    GroupMemberResponse:
      type: object
      description: |
        Alumno que cumple el filtro, con el nombre que trae la proyección local de personas. No viaja
        el email: la previsualización solo necesita identificarlo y pintarlo.
      required: [id, nombre]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 200
          example: Pedro Cordero

    GroupCoachesResponse:
      type: object
      description: Entrenadores asignados al grupo, ordenados por nombre
      required: [entrenadores]
      properties:
        entrenadores:
          type: array
          items:
            $ref: '#/components/schemas/GroupCoachResponse'

    GroupCoachResponse:
      type: object
      description: |
        Un entrenador asignado al grupo. Solo dos estados (`INVITADO`/`ACTIVO`) — igual que
        `CoachWorkloadResponse`, esta vista lee de la proyección local de club y taxonomía, que no
        conoce `DESACTIVADO`.
      required: [id, nombre, email, estado]
      properties:
        id:
          type: string
          format: uuid
          description: ID del entrenador
          example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5b
        nombre:
          $ref: '#/components/schemas/Nombre'
        email:
          $ref: '#/components/schemas/Email'
        estado:
          type: string
          enum: [INVITADO, ACTIVO]
          description: Estado de la cuenta en la proyección local del club
          example: ACTIVO

    PlanId:
      type: string
      format: uuid
      description: ID de un plan semanal
      example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5e

    CreatePlanRequest:
      type: object
      description: |
        Alta de un plan en borrador para un grupo. `semana` debe ser el lunes de esa semana — cualquier
        otro día se rechaza con 400.
      required: [grupoId, semana]
      properties:
        grupoId:
          $ref: '#/components/schemas/GroupId'
        semana:
          type: string
          format: date
          description: Lunes de la semana del plan
          example: '2026-08-17'

    PlanResponse:
      type: object
      description: |
        Un plan semanal, en borrador o publicado. Sin sesiones ni personalizaciones: es el resumen que
        alimenta el listado (`GET /planes`) — el detalle completo lo trae `GET /planes/{planId}`
        (`PlanDetalleResponse`, LAL-24).
      required: [id, grupoId, semana, estado]
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        grupoId:
          $ref: '#/components/schemas/GroupId'
        semana:
          type: string
          format: date
          example: '2026-08-17'
        estado:
          type: string
          enum: [BORRADOR, PUBLICADO]
          example: BORRADOR

    PlanesResponse:
      type: object
      description: Planes en borrador de un grupo, ordenados por semana.
      required: [planes]
      properties:
        planes:
          type: array
          items:
            $ref: '#/components/schemas/PlanResponse'

    TrainingSessionId:
      type: string
      format: uuid
      description: ID de una sesión dentro de un plan
      example: 018f9a2b-1c3d-7e4f-8a9b-0c1d2e3f4a5f

    Volumen:
      type: object
      description: |
        Distancia o tiempo de la sesión — nunca los dos. `tipo` decide qué otra propiedad va rellena;
        ausente por completo en sesiones de tipo `DESCANSO` o todavía sin definir.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [DISTANCIA, TIEMPO]
        metros:
          type: integer
          minimum: 1
          description: Presente solo si `tipo` es `DISTANCIA`
          example: 10000
        minutos:
          type: integer
          minimum: 1
          description: Presente solo si `tipo` es `TIEMPO`
          example: 45

    Ritmo:
      type: object
      description: |
        Ritmo objetivo de la sesión (ADR-0002 D6): `ABSOLUTO` (segundos por km) o `RELATIVO` a una
        marca del alumno (delta sobre una distancia de referencia). **En el MVP la UI de LAL-24 solo
        introduce `ABSOLUTO`** (AC2) — `RELATIVO` ya existe en el modelo desde LAL-114, pero su editor
        llega con LAL-27; enviarlo hoy no falla, simplemente ningún cliente lo hace todavía.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [ABSOLUTO, RELATIVO]
        segundosPorKm:
          type: integer
          minimum: 1
          description: Presente solo si `tipo` es `ABSOLUTO`
          example: 225
        referencia:
          type: string
          enum: ['5K', '10K', '21K', '42K']
          description: Presente solo si `tipo` es `RELATIVO`
        deltaSegundosPorKm:
          type: integer
          description: Presente solo si `tipo` es `RELATIVO`. Positivo = más lento, negativo = más rápido.
          example: 10

    TrainingSessionRequest:
      type: object
      description: |
        Alta de una sesión. `dia` debe caer dentro de la semana del plan (400 si no) y no coincidir
        con el de otra sesión ya creada (409, una sesión por día).
      required: [dia, tipo]
      properties:
        dia:
          type: string
          format: date
          example: '2026-08-19'
        tipo:
          type: string
          description: Catálogo cerrado del glosario (docs/glosario.md §Planificación). `DESCANSO` no admite `volumen` ni `ritmo`.
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
          example: SERIES
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/Ritmo'
        notas:
          type: string
          maxLength: 1000
          example: 8×400 m, recuperación de 200 m entre series.

    TrainingSessionUpdateRequest:
      type: object
      description: Edición de una sesión existente. Sin `dia`, que no se puede mover una vez creada.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/Ritmo'
        notas:
          type: string
          maxLength: 1000

    TrainingSessionResponse:
      type: object
      required: [id, dia, tipo]
      properties:
        id:
          $ref: '#/components/schemas/TrainingSessionId'
        dia:
          type: string
          format: date
        tipo:
          type: string
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/Ritmo'
        notas:
          type: string

    PersonalizationRequest:
      type: object
      description: |
        Override completo de una sesión para un alumno concreto (LAL-26): reemplaza tipo/volumen/
        ritmo/notas enteros, nunca combina campo a campo con la sesión base — mismo criterio que
        `TrainingSessionUpdateRequest`, sin `dia` (lo fija la sesión que sobrescribe).
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/Ritmo'
        notas:
          type: string
          maxLength: 1000
        mensajeAlAlumno:
          type: string
          maxLength: 1000
          nullable: true
          description: Texto libre visible solo para este alumno, bajo su sesión en la vista "hoy".

    PersonalizationResponse:
      type: object
      description: Una personalización vigente, embebida en `PlanDetalleResponse.personalizaciones`.
      required: [sesionId, alumnoId, tipo]
      properties:
        sesionId:
          $ref: '#/components/schemas/TrainingSessionId'
        alumnoId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/Ritmo'
        notas:
          type: string
        mensajeAlAlumno:
          type: string
          nullable: true

    PlanDetalleResponse:
      type: object
      description: |
        El plan completo con sus sesiones (LAL-24) y sus personalizaciones vigentes (LAL-26). Se
        devuelve recalculado tras `PUT`/`DELETE` de una personalización, para no obligar a una
        segunda consulta (mismo criterio que `GrupoDetalle` en `ajustarPertenenciaAGrupo`).
      required: [id, grupoId, semana, estado, sesiones]
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        grupoId:
          $ref: '#/components/schemas/GroupId'
        semana:
          type: string
          format: date
          example: '2026-08-17'
        estado:
          type: string
          enum: [BORRADOR, PUBLICADO]
          example: BORRADOR
        sesiones:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSessionResponse'
        personalizaciones:
          type: array
          description: Overrides vigentes por alumno, permitidos tanto en BORRADOR como en PUBLICADO.
          items:
            $ref: '#/components/schemas/PersonalizationResponse'

    MiPlanSemanalResponse:
      type: object
      description: |
        La semana del propio alumno, ya resuelta (LAL-29). `semana` es siempre el lunes consultado,
        exista o no una sesión ese día. `sesiones` puede tener menos de 7 elementos: un día sin
        `PublishedSession` para este alumno no aparece.
      required: [semana, sesiones]
      properties:
        semana:
          type: string
          format: date
          example: '2026-08-17'
        sesiones:
          type: array
          items:
            $ref: '#/components/schemas/MiResolvedSessionResponse'

    MiResolvedSessionResponse:
      type: object
      description: |
        Una sesión ya resuelta para el alumno. Sin `esPersonalizada`: es uso interno del módulo
        (alertas, métricas futuras) y el alumno nunca debe verlo — la única señal visible de que una
        sesión está personalizada es `mensajeDelEntrenador` (LAL-26). El alumno no recibe ningún otro
        indicador de que su sesión está personalizada (decisión de producto, docs/wireframes/05).
      required: [dia, tipo]
      properties:
        dia:
          type: string
          format: date
        tipo:
          type: string
          enum: [RODAJE, SERIES, TEMPO, TIRADA_LARGA, FARTLEK, CUESTAS, PROGRESIVO, FUERZA_CROSS, COMPETICION, DESCANSO]
        volumen:
          $ref: '#/components/schemas/Volumen'
        ritmo:
          $ref: '#/components/schemas/MiRitmoResueltoResponse'
        notas:
          type: string
          description: Notas del entrenador para el grupo (vienen de la sesión base, no del alumno)
        mensajeDelEntrenador:
          type: string
          nullable: true
          description: |
            Mensaje del entrenador solo para este alumno. Presente únicamente cuando la sesión tiene
            una personalización (LAL-26) y el entrenador ha rellenado el campo.
        reporte:
          $ref: '#/components/schemas/MiReporteResponse'
        reajuste:
          $ref: '#/components/schemas/MiReajusteResponse'

    AlertasResponse:
      type: object
      description: |
        Alertas activas del entrenador (LAL-116), en el orden que resuelve el lector — dolor
        reportado y ausencia prolongada primero (urgente), ritmo fuera de objetivo después
        (informativo). Sin paginación en el MVP: el panel es "por excepción", no un listado completo.
      required: [alertas]
      properties:
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/CoachAlert'

    CoachAlert:
      description: |
        Una alerta accionable del entrenador sobre un alumno de sus grupos, discriminada por `tipo`.

        La unión no declara `discriminator` a propósito, mismo motivo que `TagValueMetadata`: con él,
        `openapi-generator` no compila el Kotlin generado. Sin él, ambos generadores producen lo
        correcto (sealed interface en Kotlin, unión discriminada por literal en TypeScript) — el
        precio es que Jackson no puede deserializar la unión, irrelevante porque es de solo lectura.

        Nunca deriva de `seguimiento.marca_alumno` (las marcas del alumno): la matriz de autorización
        prohíbe explícitamente cualquier lectura agregada de marcas para ENTRENADOR o ADMIN.
      oneOf:
        - $ref: '#/components/schemas/DolorReportadoAlert'
        - $ref: '#/components/schemas/SinReportarAlert'
        - $ref: '#/components/schemas/RitmoFueraDeObjetivoAlert'

    DolorReportadoAlert:
      type: object
      description: El alumno marcó la flag de dolor al reportar una sesión (LAL-30).
      required: [tipo, alumnoId, grupoId, dia, reportadoEn]
      properties:
        tipo:
          type: string
          enum: [DOLOR_REPORTADO]
        alumnoId:
          type: string
          format: uuid
        grupoId:
          $ref: '#/components/schemas/GroupId'
        dia:
          type: string
          format: date
          description: Día de la sesión reportada.
        notas:
          type: string
          description: Nota libre del reporte, si la hay — la cita que hace la alerta accionable.
        reportadoEn:
          type: string
          format: date-time

    SinReportarAlert:
      type: object
      description: |
        El alumno lleva más de 7 días sin reportar ninguna sesión, teniendo plan publicado en ese
        periodo.
      required: [tipo, alumnoId, grupoId, diasSinReportar]
      properties:
        tipo:
          type: string
          enum: [SIN_REPORTAR]
        alumnoId:
          type: string
          format: uuid
        grupoId:
          $ref: '#/components/schemas/GroupId'
        diasSinReportar:
          type: integer
          description: Días transcurridos desde el último reporte (o desde que hay plan, si nunca reportó).
        ultimoReporteEn:
          type: string
          format: date-time
          description: Ausente si el alumno nunca ha reportado ninguna sesión.

    RitmoFueraDeObjetivoAlert:
      type: object
      description: |
        Sesión reportada con una nota que sugiere un ritmo muy distinto al objetivo (heurística de
        texto en el MVP — palabras como "por encima"/"más rápido"/"más lento"; un análisis real de
        FIT/GPX queda fuera del MVP, ver `docs/wireframes/08-coach-alerts.md`).
      required: [tipo, alumnoId, grupoId, dia, notas]
      properties:
        tipo:
          type: string
          enum: [RITMO_FUERA_DE_OBJETIVO]
        alumnoId:
          type: string
          format: uuid
        grupoId:
          $ref: '#/components/schemas/GroupId'
        dia:
          type: string
          format: date
        notas:
          type: string
          description: Nota libre del reporte que disparó la heurística.

    MiReajusteRequest:
      type: object
      description: |
        Lo que el alumno envía al reajustar el día de una sesión (LAL-33). `diaDestino` obligatorio si
        `accion` es `MOVIDA`, ausente si es `SALTADA` — el backend rechaza la combinación contraria con
        400. `resolucionConflicto` solo se envía al reintentar tras un 409 `DIA_DESTINO_OCUPADO`.
      required: [accion, motivo]
      properties:
        accion:
          type: string
          enum: [MOVIDA, SALTADA]
        diaDestino:
          type: string
          format: date
          description: Día destino, hasta 7 días vista. Obligatorio si accion es MOVIDA.
        motivo:
          type: string
          enum: [CANSANCIO, MOLESTIAS, IMPREVISTO]
        resolucionConflicto:
          type: string
          enum: [REEMPLAZAR, INTERCAMBIAR]
          description: |
            Cómo resolver que diaDestino ya tenga una sesión efectiva. Ausente en el primer intento;
            se envía al reintentar tras un 409 DIA_DESTINO_OCUPADO.
        mensaje:
          type: string
          maxLength: 1000
          description: Texto libre opcional para el entrenador.

    MiReajusteResponse:
      type: object
      description: El reajuste ya guardado de una sesión (LAL-33).
      required: [accion, diaPlanificado, motivo, marcaDolor]
      properties:
        accion:
          type: string
          enum: [MOVIDA, SALTADA]
        diaPlanificado:
          type: string
          format: date
          description: Día original de la sesión en el plan publicado, sin reajustar.
        diaDestino:
          type: string
          format: date
          description: Presente solo si accion es MOVIDA
        motivo:
          type: string
          enum: [CANSANCIO, MOLESTIAS, IMPREVISTO]
        mensaje:
          type: string
        marcaDolor:
          type: boolean
          description: Se activa sola cuando motivo es MOLESTIAS; el alumno no la marca a mano.

    MiReporteRequest:
      type: object
      description: |
        Lo que el alumno envía al reportar una sesión (LAL-30). `valoracion` obligatoria si `estado`
        es `HECHO` o `PARCIAL`, ausente si es `NO_HECHO`; `motivo` obligatorio si `estado` es
        `NO_HECHO`, ausente en el resto — el backend rechaza la combinación contraria con 400.
      required: [estado]
      properties:
        estado:
          type: string
          enum: [HECHO, PARCIAL, NO_HECHO]
        valoracion:
          type: integer
          minimum: 1
          maximum: 5
          description: Cómo se ha sentido, 1 (peor) a 5 (mejor). Obligatoria si estado es HECHO o PARCIAL.
        motivo:
          type: string
          enum: [CANSANCIO, TRABAJO, VIAJE, ENFERMEDAD, SIN_TIEMPO, MOLESTIAS, OTRA]
          description: Por qué no se hizo. Obligatorio si estado es NO_HECHO.
        notas:
          type: string
          maxLength: 1000
          description: Texto libre opcional para el entrenador.

    MiReporteResponse:
      type: object
      description: |
        El reporte ya guardado de una sesión (LAL-30). Sin `descripcionDolor`: el texto libre de
        ubicación/intensidad del dolor no se captura todavía (pendiente jurídico, ver el módulo).
      required: [estado, marcaDolor, reportadoEn]
      properties:
        estado:
          type: string
          enum: [HECHO, PARCIAL, NO_HECHO]
        valoracion:
          type: integer
          minimum: 1
          maximum: 5
        motivo:
          type: string
          enum: [CANSANCIO, TRABAJO, VIAJE, ENFERMEDAD, SIN_TIEMPO, MOLESTIAS, OTRA]
        notas:
          type: string
        marcaDolor:
          type: boolean
          description: Se activa sola cuando motivo es MOLESTIAS; el alumno no la marca a mano.
        reportadoEn:
          type: string
          format: date-time

    MiConsentimientoRequest:
      type: object
      description: Lo que el alumno envía al conceder consentimiento (LAL-128).
      required: [versionConsentimiento]
      properties:
        versionConsentimiento:
          type: string
          description: Versión del texto de consentimiento mostrado al marcar la casilla.

    MiConsentimientoResponse:
      type: object
      description: |
        El propio estado de consentimiento de datos de salud del art. 9.2.a RGPD (LAL-128).
        `PENDIENTE` es el estado de quien activó su cuenta antes de que existiera este mecanismo —
        no hay ninguna fila de consentimiento todavía.
      required: [estado]
      properties:
        estado:
          type: string
          enum: [PENDIENTE, VIGENTE, REVOCADO]
        versionTexto:
          type: string
          description: Versión de texto de la última concesión. Ausente si el estado es PENDIENTE.
        concedidoEn:
          type: string
          format: date-time
        revocadoEn:
          type: string
          format: date-time
          nullable: true

    MiMarcaRequest:
      type: object
      description: Lo que el alumno envía al registrar su marca de una distancia (LAL-31).
      required: [tiempoSegundos]
      properties:
        tiempoSegundos:
          type: integer
          minimum: 1
          description: Tiempo total en segundos. Sin tope superior — 21K/42K reales suelen superar la hora.

    MiMarcaResponse:
      type: object
      description: La marca del alumno para una distancia (LAL-31), o su ausencia.
      required: [distancia]
      properties:
        distancia:
          type: string
          enum: ['5K', '10K', '21K', '42K']
        tiempoSegundos:
          type: integer
          description: Ausente si el alumno no tiene marca todavía en esta distancia.
        modificadoEn:
          type: string
          format: date-time
          description: Ausente si el alumno no tiene marca todavía en esta distancia.

    MisMarcasResponse:
      type: object
      description: Las cuatro marcas del alumno, siempre en el orden 5K, 10K, 21K, 42K.
      required: [marcas]
      properties:
        marcas:
          type: array
          items:
            $ref: '#/components/schemas/MiMarcaResponse'

    MiRitmoResueltoResponse:
      type: object
      description: |
        El ritmo ya resuelto para el alumno: un único valor absoluto, nunca el origen (ADR-0002 D6) —
        el alumno no distingue absoluto de relativo, salvo el texto sutil que delata
        `referenciaDistancia` cuando el ritmo viene de una marca.

        Un ritmo de origen relativo se resuelve contra la marca real del alumno (`marca + delta`) en cuanto
        la tiene; mientras no la tenga, resuelve con `faltaMarca` presente y
        `segundosPorKm`/`referenciaDistancia` ausentes — el frontend muestra el empty state con CTA
        "Añade tu marca de [distancia]".
      properties:
        segundosPorKm:
          type: integer
          description: Ausente si el ritmo no se ha podido resolver (ver `faltaMarca`)
          example: 225
        referenciaDistancia:
          type: string
          enum: ['5K', '10K', '21K', '42K']
          description: Presente solo cuando `segundosPorKm` viene de una marca del alumno
        faltaMarca:
          type: string
          enum: ['5K', '10K', '21K', '42K']
          description: Presente cuando el ritmo es relativo y el alumno todavía no tiene esa marca

    PublicacionResponse:
      type: object
      description: |
        Resultado de publicar un plan (LAL-25): el plan ya en `PUBLICADO`, con sus sesiones, y el
        número de alumnos que quedaron congelados en el snapshot en ese momento.
      required: [plan, alumnosEnSnapshot]
      properties:
        plan:
          $ref: '#/components/schemas/PlanDetalleResponse'
        alumnosEnSnapshot:
          type: integer
          minimum: 0
          description: Tamaño del snapshot de alumnos congelado al publicar. Puede ser 0 (grupo sin alumnos).
          example: 12

    GroupOverrideRequest:
      type: object
      description: |
        Sentido del ajuste manual: `true` mete al alumno en el grupo aunque no cumpla el filtro,
        `false` lo saca aunque lo cumpla. No hay tercer estado — para volver a dejarlo en manos del
        filtro se borra la excepción con el DELETE.
      required: [incluido]
      properties:
        incluido:
          type: boolean
          example: true

    GroupMemberOrigin:
      type: string
      description: |
        Por qué está el alumno en el grupo hoy: porque cumple todos los tags requeridos (`FILTRO`) o
        porque alguien lo metió a mano y no los cumple (`INCLUSION_MANUAL`). Se recalcula en cada
        consulta y los dos valores son excluyentes.
      enum: [FILTRO, INCLUSION_MANUAL]

    GroupMembershipResponse:
      type: object
      description: |
        Miembro del grupo con el motivo por el que lo es.

        `ajusteManual` es una pregunta distinta de `origen`: dice si existe una excepción que se pueda
        quitar. Un alumno metido a mano que además cumple el filtro sale con `origen: FILTRO` y
        `ajusteManual: true` — está por el filtro, pero su excepción sigue ahí y se puede borrar.
      required: [id, nombre, origen, ajusteManual]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 200
          example: Pedro Cordero
        origen:
          $ref: '#/components/schemas/GroupMemberOrigin'
        ajusteManual:
          type: boolean
          description: Hay una excepción manual guardada para este alumno en este grupo
          example: false

    GroupExclusionResponse:
      type: object
      description: |
        Alumno sacado del grupo a mano. **No** es miembro y no cuenta en `total`. `cumpleFiltro`
        distingue la exclusión que de verdad lo está dejando fuera de la que hoy no cambia nada
        porque el alumno tampoco cumple el filtro.
      required: [id, nombre, cumpleFiltro]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 200
          example: Marta Lois
        cumpleFiltro:
          type: boolean
          example: true

    GroupDetailResponse:
      type: object
      description: |
        Un grupo con su composición actual. `total` es el tamaño de `miembros`; las exclusiones no
        cuentan, así que el desglose que se pinta en pantalla es «los del filtro, menos los excluidos,
        más los incluidos a mano».

        No se pagina ni se trunca: el dimensionado previsto es de un par de cientos de alumnos por
        club. `miembros` viene ordenado por nombre.
      required: [id, nombre, valores, total, miembros, excluidos]
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        nombre:
          $ref: '#/components/schemas/GroupName'
        valores:
          type: array
          items:
            $ref: '#/components/schemas/TagValueId'
        total:
          type: integer
          format: int32
          minimum: 0
          example: 13
        miembros:
          type: array
          items:
            $ref: '#/components/schemas/GroupMembershipResponse'
        excluidos:
          type: array
          items:
            $ref: '#/components/schemas/GroupExclusionResponse'

    AuditEventResponse:
      type: object
      description: Un asiento del log de auditoría de autorización (ADR-0009 D15).
      required: [id, tipo, recurso, ocurridoEn]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ACCESO_DENEGADO, ACCESO_DATOS_SENSIBLES]
        actorId:
          type: string
          format: uuid
          nullable: true
          description: '`null` si el evento se anonimizó al ejercer el derecho al olvido, o si lo originó el sistema.'
        sujetoId:
          type: string
          format: uuid
          nullable: true
          description: Tercero sobre el que recaía la operación, cuando lo hay. `null` tras anonimización.
        recurso:
          type: string
          description: Recurso y acción de la matriz de autorización, ej. `"PLAN:PUBLISH"`, o el dato leído
          example: 'PLAN:PUBLISH'
        motivo:
          type: string
          nullable: true
          description: Motivo de la denegación. Solo presente en `ACCESO_DENEGADO`.
          example: Forbidden
        ocurridoEn:
          type: string
          format: date-time

    AuditEventsResponse:
      type: object
      description: Asientos del log de auditoría que cumplen el filtro, del más reciente al más antiguo.
      required: [eventos]
      properties:
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'

    ErrorResponse:
      type: object
      description: |
        Error estructurado para respuestas 4xx y 5xx.
        El frontend traduce `code` a mensaje localizado; `field` solo aparece en errores de entrada.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable para que el frontend lo traduzca
          example: INVALID_INPUT
        field:
          type: string
          nullable: true
          description: |
            Campo que originó el error, cuando hay uno concreto. Habitual en los 400 de validación,
            pero no exclusivo: `DUPLICATE_LABEL` lo lleva en un 409 para señalar qué campo choca.
          example: email
        message:
          type: string
          description: Mensaje legible (orientativo, no usar para lógica de cliente)
          example: El email no tiene un formato válido
