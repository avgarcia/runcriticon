openapi: 3.0.3
info:
  title: Runcriticon API
  version: 0.1.0
  description: API REST de Runcriticon — esqueleto andante H0 (ADR-0001 D10)
servers:
  - url: /api

paths:
  /entrenadores:
    post:
      summary: Dar de alta un entrenador por invitación
      operationId: invitarEntrenador
      tags: [entrenadores]
      requestBody:
        $ref: '#/components/requestBodies/InviteCoachBody'
      responses:
        '201':
          $ref: '#/components/responses/EntrenadorCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /entrenadores/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el entrenador (invalida la anterior)
      operationId: reinvitarEntrenador
      tags: [entrenadores]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del entrenador
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Nueva invitación emitida; la anterior queda invalidada
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /alumnos:
    post:
      summary: Dar de alta un alumno por invitación
      operationId: invitarAlumno
      tags: [alumnos]
      requestBody:
        $ref: '#/components/requestBodies/InviteStudentBody'
      responses:
        '201':
          $ref: '#/components/responses/AlumnoCreado'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /alumnos/{id}/invitaciones:
    post:
      summary: Emitir una nueva invitación para el alumno (invalida la anterior)
      operationId: reinvitarAlumno
      tags: [alumnos]
      parameters:
        - name: id
          in: path
          required: true
          description: ID del alumno
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Nueva invitación emitida; la anterior queda invalidada
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /activacion:
    post:
      summary: Activar la cuenta fijando contraseña con el token de invitación
      operationId: activarCuenta
      tags: [activacion]
      requestBody:
        $ref: '#/components/requestBodies/ActivationBody'
      responses:
        '200':
          $ref: '#/components/responses/CuentaActivada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '409':
          $ref: '#/components/responses/ErrorConflict'

  /sesion:
    post:
      summary: Iniciar sesión con email y contraseña (ADR-0003 D5)
      operationId: iniciarSesion
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/CredentialsBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          description: |
            Contraseña caducada (ADR-0003 D7). Cuerpo ErrorResponse con `code=PASSWORD_EXPIRED`;
            no se crea sesión. El cliente debe llevar al cambio obligatorio (POST /sesion/contrasena).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sesion/actual:
    get:
      summary: Consultar la sesión en curso
      operationId: consultarSesion
      tags: [sesion]
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'

  /sesion/cierre:
    post:
      summary: Cerrar la sesión en curso (ADR-0003 D11)
      operationId: cerrarSesion
      tags: [sesion]
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'

  /sesion/contrasena:
    post:
      summary: Fijar una contraseña nueva cuando la actual ha caducado (ADR-0003 D7)
      operationId: cambiarContrasenaCaducada
      tags: [sesion]
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeBody'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '409':
          $ref: '#/components/responses/ErrorConflict'

components:
  requestBodies:
    InviteCoachBody:
      description: Datos necesarios para dar de alta un entrenador
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachRequest'

    InviteStudentBody:
      description: Datos necesarios para dar de alta un alumno
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentRequest'

    ActivationBody:
      description: Token de invitación y contraseña elegida
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationRequest'

    CredentialsBody:
      description: Email y contraseña para iniciar sesión
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialsRequest'

    PasswordChangeBody:
      description: Email, contraseña caducada y contraseña nueva (cambio forzado, ADR-0003 D7)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeRequest'

  responses:
    EntrenadorCreado:
      description: Entrenador creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteCoachResponse'

    AlumnoCreado:
      description: Alumno creado; invitación enviada por email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteStudentResponse'

    CuentaActivada:
      description: Cuenta activada; sesión iniciada (cookie httpOnly)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivationResponse'

    SesionIniciada:
      description: Sesión iniciada; cookie de sesión httpOnly establecida (ADR-0003 D10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'

    ErrorBadRequest:
      description: Entrada inválida (campo requerido vacío, formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorUnauthorized:
      description: No autenticado; la sesión ha expirado o no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorForbidden:
      description: El principal no tiene permiso (ADR-0009 D12 — cuerpo neutro sin detalles)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorNotFound:
      description: Recurso no encontrado o no pertenece al club del principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ErrorConflict:
      description: La operación choca con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    InviteCoachRequest:
      type: object
      description: Datos necesarios para dar de alta un entrenador por invitación
      required: [nombre, email]
      properties:
        nombre:
          type: string
          description: Nombre completo del entrenador
          minLength: 1
          maxLength: 200
          example: Ana García
        email:
          type: string
          format: email
          description: Dirección de email del entrenador (identificador único en el club)
          maxLength: 254
          example: ana@club.es

    InviteCoachResponse:
      type: object
      description: Respuesta al alta del entrenador
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado

    InviteStudentRequest:
      type: object
      description: Datos necesarios para dar de alta un alumno por invitación
      required: [nombre, email]
      properties:
        nombre:
          type: string
          description: Nombre completo del alumno
          minLength: 1
          maxLength: 200
          example: Marta Ruiz
        email:
          type: string
          format: email
          description: Dirección de email del alumno (identificador único en el club)
          maxLength: 254
          example: marta@club.es

    InviteStudentResponse:
      type: object
      description: Respuesta al alta del alumno
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: ID del usuario recién creado

    ActivationRequest:
      type: object
      description: Datos para activar la cuenta por invitación (ADR-0003 D4, D6)
      required: [token, password]
      properties:
        token:
          type: string
          description: Token de invitación recibido en el email
          minLength: 1
        password:
          type: string
          format: password
          description: Contraseña elegida; política ADR-0003 D6 (12–128, sin datos personales, no reutilizada)
          minLength: 12
          maxLength: 128

    ActivationResponse:
      type: object
      description: Sesión iniciada tras la activación (mismo shape que la sesión de login)
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        role:
          type: string
          description: Rol del usuario (ADMIN, ENTRENADOR, ALUMNO)

    CredentialsRequest:
      type: object
      description: Credenciales de login con contraseña (ADR-0003 D5)
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254
        password:
          type: string
          format: password
          description: Contraseña en claro (se verifica contra el hash Argon2id)
          minLength: 1
          maxLength: 128

    SessionResponse:
      type: object
      description: Sesión iniciada; nunca incluye datos sensibles ni el hash de la contraseña
      required: [userId, clubId, role]
      properties:
        userId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        role:
          type: string
          description: Rol del usuario (ADMIN, ENTRENADOR, ALUMNO)

    PasswordChangeRequest:
      type: object
      description: |
        Cambio forzado de contraseña caducada (ADR-0003 D7). Revalida la contraseña actual (la
        caducada que el usuario tecleó) y fija la nueva (política D6); al lograrlo, inicia sesión.
      required: [email, currentPassword, newPassword]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          maxLength: 254
        currentPassword:
          type: string
          format: password
          description: Contraseña actual (caducada) para revalidar la identidad
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          description: Contraseña nueva; política ADR-0003 D6 (12–128, sin datos personales, no reutilizada)
          minLength: 12
          maxLength: 128

    ErrorResponse:
      type: object
      description: |
        Error estructurado para respuestas 4xx (ADR-0012 D19).
        El frontend traduce `code` a mensaje localizado; `field` solo aparece en errores de entrada.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable para que el frontend lo traduzca
          example: INVALID_INPUT
        field:
          type: string
          nullable: true
          description: Campo que originó el error (solo en 400 con campo concreto)
          example: email
        message:
          type: string
          description: Mensaje legible (orientativo, no usar para lógica de cliente)
          example: El email no tiene un formato válido
        details:
          type: string
          nullable: true
          description: Información adicional de depuración (solo en entornos no productivos)
