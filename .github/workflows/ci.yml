name: CI

# Etapa de CI de ADR-0010 D2, agnóstica de nube (no toca AWS): puertas de calidad y seguridad, y la imagen
# Docker probada en el staging local y publicada en GHCR desde `main` (H0a). El despliegue a App Runner con OIDC
# es H0b, pendiente de cuenta AWS. Cruces: ADR-0010, ADR-0016, ADR-0013.
#
# Las acciones se fijan por SHA de commit (regla Semgrep github-actions-mutable-action-tag): un tag
# mutable como @v7 puede reapuntarse a código malicioso. El comentario indica la versión legible.
# Dependabot (ecosistema github-actions) mantiene los SHAs actualizados.
#
# Triggers por path (ADR-0010 D16): en una PR, backend, frontend, imagen y Terraform solo corren si la PR toca algo
# que les afecta (lo decide el job `changes`). El filtro va en el `if:` de cada job y no en `on.pull_request.paths`:
# un job saltado por su `if:` cuenta como superado para los checks obligatorios de la rama, mientras que un
# workflow que no arranca los deja esperando para siempre y bloquea la PR.

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: los jobs solo leen el repo.
permissions:
  contents: read

# Una ejecución por rama. En las PRs, la nueva cancela a la anterior; en `main` no, porque cancelar a medias dejaría
# sin publicar en GHCR la imagen de un merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Cambios · qué jobs necesita la PR (ADR-0010 D16)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docker: ${{ steps.classify.outputs.docker }}
      terraform: ${{ steps.classify.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # En una PR, HEAD es el merge de prueba con la base: HEAD^1 es la punta de la base y el diff entre ambos
          # es exactamente lo que la PR cambia sobre ella.
          fetch-depth: 2

      - name: Clasificar los ficheros cambiados
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        # En un push a `main` corre todo: la imagen se publica en cada merge (D18) y `main` se valida entero.
        # Las reglas por path y el fallo cerrado viven en el script.
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | bash .github/scripts/ci-changes.sh
          else
            bash .github/scripts/ci-changes.sh < /dev/null
          fi
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend · puertas Gradle (ktlint + detekt + ArchUnit + Modulith + tests)
    needs: changes
    # Falla cerrado: si `changes` no termina bien, el job corre igual. Sin esto, un `changes` roto saltaría todos los
    # jobs que dependen de él y los checks obligatorios saldrían en verde sin haber ejecutado nada.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar GraalVM CE 21 — build/test (runtime es 25; ADR-0016 D7)
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Gradle (cache + validación del wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build
        # build => check => ktlintCheck + detekt + test (ArchUnit, Modulith verify, Kotest).
        # `test` incluye los IntegrationTestBase (Spring + Testcontainers Postgres): sí hace falta
        # Docker, que ubuntu-latest trae preinstalado.
        # --build-cache explícito: setup-gradle ya cachea el Gradle User Home entre runs (D15).
        run: ./gradlew build --no-daemon --build-cache --stacktrace

      - name: Contrato de eventos (JSON Schema, ADR-0007 D11 / ADR-0010 D14)
        # Tarea aparte de `build`/`check` (no cuelga de check.dependsOn): la hace visible como su
        # propio check en la PR en vez de enterrada dentro del build general. La mayoría son tests
        # unitarios de serialización sin Spring, pero los *OpenApiContractTest (identidad/contracts)
        # arrancan el backend completo con @SpringBootTest + Testcontainers: este step también
        # necesita Docker.
        run: ./gradlew contractTest --no-daemon --build-cache --stacktrace

      - name: Publicar cobertura del backend (JaCoCo, ADR-0010 D7 "cobertura se publica siempre")
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/build/reports/jacoco/test
          retention-days: 30

  frontend:
    name: Frontend · lint + test + build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node (version fijada en frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente API (ng-openapi-gen)
        run: npm run gen:api

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier, ADR-0010 D7)
        run: npm run format:check

      - name: Tests (Jest — collectCoverage ya activo en jest.config.js)
        run: npm test -- --ci

      - name: Publicar cobertura del frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage
          retention-days: 30

      - name: Build de producción
        run: npm run build

      - name: Caché de navegadores Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar navegadores Playwright (con deps del SO)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo deps del SO (navegador ya en caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright + axe-core)
        # Servir y testear en el MISMO step, a propósito: un proceso puesto en segundo plano con `&`
        # muere en cuanto termina el step que lo lanzó (cada `run:` es un shell nuevo), así que el
        # servidor tiene que arrancar y el test correr dentro del mismo bloque. dist/runcriticon/browser
        # es la salida servible del build (angular.json outputPath). Ningún spec de e2e/ necesita
        # backend: todos interceptan la red con page.route().
        #
        # `serve`, no `http-server`: los specs navegan directo a rutas hijas (`/login`,
        # `/club/ajustes`...) y necesitan el *fallback* de SPA a `index.html`. En `serve`, `-s` es
        # justo ese modo single-page; en `http-server` significaría "silent" y serviría 404 en esas
        # rutas — se probó en local y tumbaba 27 de los 32 tests.
        run: |
          npx serve -s dist/runcriticon/browser -l 4200 &
          npx wait-on http://localhost:4200 -t 60000
          npm run e2e
        env:
          CI: true

  docker-image:
    name: Imagen Docker · staging local + publicación en GHCR desde main
    # Etapa 1 de ADR-0010 D2 y H0a del plan: construye la imagen, la levanta en el staging local (configurada como
    # en App Runner, detrás de un proxy TLS) y pasa el smoke. Solo en un push a `main`, y solo si el smoke pasa, la
    # publica en GHCR como runcriticon-backend:main-<sha7> (D3/D18). En las PRs detecta igualmente cualquier rotura
    # del Dockerfile, incluidas las de Dependabot del ecosistema docker.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de la imagen (backend/Dockerfile, contexto = raíz del repo)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          # Al daemon local para el smoke; se publica después, solo si pasa.
          load: true
          tags: runcriticon-backend:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Caché de layers en la caché de GitHub Actions (ADR-0010 D15).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Contrato de variables con App Runner (staging local = Terraform)
        run: python3 infrastructure/staging-local/check_env_contract.py

      - name: Levantar el staging local con la imagen construida
        env:
          RUNCRITICON_IMAGE: runcriticon-backend:ci
        run: docker compose -f infrastructure/staging-local/docker-compose.yml up -d --no-build

      - name: Smoke (health, CSRF tras el proxy, login, sesión y SPA)
        run: bash infrastructure/staging-local/smoke.sh

      - name: Publicar en GHCR (main-<sha7>)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${OWNER,,}/runcriticon-backend:main-${GITHUB_SHA::7}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag runcriticon-backend:ci "$image"
          docker push "$image"
          echo "Publicada $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Parar el staging local
        if: always()
        run: docker compose -f infrastructure/staging-local/docker-compose.yml down -v

  e2e-real:
    name: E2E · recorrido entrenador→alumno contra el backend real
    # Complementa al e2e del job `frontend`, que mockea toda la red: aquí la SPA, la API y Postgres son los reales (la
    # imagen de producción con el perfil `local`, que deja leer en el log los tokens de invitación; ver
    # infrastructure/e2e). Lo que ningún otro test ve: que el contrato entre frontend y backend, los eventos del
    # outbox y las proyecciones encajan de extremo a extremo. Corre con la imagen, así que se filtra como ella.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de la imagen (misma que la del job de la imagen; la caché de layers evita repetir el trabajo)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: runcriticon-backend:e2e
          # Solo lee la caché: la escribe el job de la imagen, y dos jobs escribiendo a la vez la misma entrada es
          # una carrera sin beneficio.
          cache-from: type=gha

      - name: Configurar Node (version fijada en frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Caché de navegadores Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar navegadores Playwright (con deps del SO)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Instalar solo deps del SO (navegador ya en caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Levantar el entorno (Postgres + la imagen con la SPA y la API)
        env:
          RUNCRITICON_IMAGE: runcriticon-backend:e2e
        run: |
          docker compose -f infrastructure/e2e/docker-compose.yml up -d --no-build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"' && exit 0
            sleep 3
          done
          echo "la app no respondió UP en 180 s" >&2
          exit 1

      - name: E2E contra el backend real (Playwright)
        working-directory: frontend
        run: npm run e2e:real
        env:
          CI: true

      - name: Informe y trazas de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-real-trazas
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Log de la app (solo si falla)
        if: failure()
        run: docker compose -f infrastructure/e2e/docker-compose.yml logs --no-color --tail=300 app

      - name: Parar el entorno
        if: always()
        run: docker compose -f infrastructure/e2e/docker-compose.yml down -v

  dependency-review:
    name: Seguridad · dependencias vulnerables (dependency review, ADR-0010 D7/D14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Revisar dependencias nuevas/cambiadas del diff de la PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Seguridad · escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear secretos (ADR-0013 D12)
        # Sale con código != 0 si encuentra cualquier secreto; --redact evita imprimirlos.
        run: gitleaks git . --no-banner --redact

  sast:
    name: Seguridad · análisis estático (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: pip install --quiet semgrep

      - name: Escanear (Kotlin + TypeScript + OWASP Top 10)
        # --error hace fallar el job ante hallazgos.
        run: semgrep scan --config p/kotlin --config p/typescript --config p/owasp-top-ten --error

  terraform:
    name: Infra · Terraform (fmt + validate + test)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Formato canónico (ADR-0006 D18)
        run: terraform fmt -check -recursive

      - name: Validar módulos y entornos (ADR-0006 D25 — test de Terraform en CI)
        # init sin backend ni credenciales: solo descarga providers y valida sintaxis/refs.
        run: |
          set -e
          for d in modules/*/ environments/*/; do
            echo "== $d =="
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
          done

      - name: Tests con provider mockeado (terraform test + mock_provider)
        # Valida la configuración de cada módulo —incluido App Runner, que LocalStack no puede
        # emular— sin AWS ni credenciales. Solo corre en módulos con tests/*.tftest.hcl.
        run: |
          set -e
          for d in modules/*/; do
            if compgen -G "${d}tests/*.tftest.hcl" > /dev/null; then
              echo "== test $d =="
              terraform -chdir="$d" init -backend=false -input=false -no-color
              terraform -chdir="$d" test -no-color
            fi
          done
