name: CI

# Pipeline agnóstico de infraestructura (no toca AWS): solo puertas de calidad y seguridad.
# El despliegue (App Runner + OIDC) llega en H0 Bloque 4. Cruces: ADR-0010, ADR-0016, ADR-0013.
#
# Las acciones se fijan por SHA de commit (regla Semgrep github-actions-mutable-action-tag): un tag
# mutable como @v7 puede reapuntarse a código malicioso. El comentario indica la versión legible.
# Dependabot (ecosistema github-actions) mantiene los SHAs actualizados.

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: los jobs solo leen el repo.
permissions:
  contents: read

# Una ejecución por rama; las nuevas cancelan a las anteriores en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · puertas Gradle (ktlint + detekt + ArchUnit + Modulith + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configurar GraalVM CE 21 — build/test (runtime es 25; ADR-0016 D7)
        uses: graalvm/setup-graalvm@186d0493a2df5eb62df5ecc498883d18fd58c303 # v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Gradle (cache + validación del wrapper)
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build
        # build => check => ktlintCheck + detekt + test (ArchUnit, Modulith verify, Kotest).
        # Es análisis estático + tests sin contexto Spring: NO necesita base de datos.
        # --build-cache explícito: setup-gradle ya cachea el Gradle User Home entre runs (D15).
        run: ./gradlew build --no-daemon --build-cache --stacktrace

      - name: Contrato de eventos (JSON Schema, ADR-0007 D11 / ADR-0010 D14)
        # Tarea aparte de `build`/`check` (no cuelga de check.dependsOn): la hace visible como su
        # propio check en la PR en vez de enterrada dentro del build general. Sin contexto Spring
        # ni base de datos — solo serializa el evento y lo valida contra su JSON Schema.
        run: ./gradlew contractTest --no-daemon --build-cache --stacktrace

  frontend:
    name: Frontend · lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configurar Node (version fijada en frontend/.nvmrc)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente API (ng-openapi-gen)
        run: npm run gen:api

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Jest)
        run: npm test -- --ci

      - name: Build de producción
        run: npm run build

  secret-scan:
    name: Seguridad · escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear secretos (ADR-0013 D12)
        # Sale con código != 0 si encuentra cualquier secreto; --redact evita imprimirlos.
        run: gitleaks git . --no-banner --redact

  sast:
    name: Seguridad · análisis estático (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: pip install --quiet semgrep

      - name: Escanear (Kotlin + TypeScript + OWASP Top 10)
        # --error hace fallar el job ante hallazgos.
        run: semgrep scan --config p/kotlin --config p/typescript --config p/owasp-top-ten --error

  terraform:
    name: Infra · Terraform (fmt + validate + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Formato canónico (ADR-0006 D18)
        run: terraform fmt -check -recursive

      - name: Validar módulos y entornos (ADR-0006 D25 — test de Terraform en CI)
        # init sin backend ni credenciales: solo descarga providers y valida sintaxis/refs.
        run: |
          set -e
          for d in modules/*/ environments/*/; do
            echo "== $d =="
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
          done

      - name: Tests con provider mockeado (terraform test + mock_provider)
        # Valida la configuración de cada módulo —incluido App Runner, que LocalStack no puede
        # emular— sin AWS ni credenciales. Solo corre en módulos con tests/*.tftest.hcl.
        run: |
          set -e
          for d in modules/*/; do
            if compgen -G "${d}tests/*.tftest.hcl" > /dev/null; then
              echo "== test $d =="
              terraform -chdir="$d" init -backend=false -input=false -no-color
              terraform -chdir="$d" test -no-color
            fi
          done
