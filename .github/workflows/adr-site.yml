name: Publicar sitio de ADRs

# Construye el sitio navegable de ADRs con log4brains y lo publica en
# GitHub Pages. Requiere que Pages esté habilitado en los ajustes del
# repositorio con "Source: GitHub Actions".
#
# Acciones fijadas por SHA de commit (regla Semgrep github-actions-mutable-action-tag);
# el comentario indica la versión legible. Dependabot mantiene los SHAs actualizados.

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - '.log4brains.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/adr-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # log4brains usa el historial git para las fechas de los ADR

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio de ADRs
        run: npx log4brains build --basePath "/${{ github.event.repository.name }}"

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .log4brains/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
