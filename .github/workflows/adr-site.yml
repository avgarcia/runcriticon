name: Publicar sitio de ADRs

# Construye el sitio navegable de ADRs con log4brains y lo publica en
# GitHub Pages. Requiere que Pages esté habilitado en los ajustes del
# repositorio con "Source: GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - '.log4brains.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/adr-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # log4brains usa el historial git para las fechas de los ADR

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio de ADRs
        run: npx log4brains build --basePath "/${{ github.event.repository.name }}"

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: .log4brains/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
