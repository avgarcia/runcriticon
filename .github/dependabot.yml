# Dependabot — revisión de dependencias (ADR-0010, quality gate transversal).
# Agrupa actualizaciones menores para no inundar de PRs; las mayores van sueltas.
# `cooldown` retrasa las actualizaciones unos días tras publicarse la versión: alineado con
# ADR-0001 D12 (estabilidad sobre novedad; nada de releases recién salidas) y exigido por la
# regla Semgrep dependabot-missing-cooldown.
version: 2

updates:
  # --- Backend: Gradle ---
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      test:
        patterns:
          - "io.kotest*"
          - "io.mockk*"
          - "org.testcontainers*"
          - "com.tngtech.archunit*"
    ignore:
      # ognl es dependencia de test del motor estándar de Thymeleaf; su versión la dicta
      # Thymeleaf (3.1.5 → ognl 3.3.x). La 3.4.x rompe con NoSuchMethodError en OgnlContext.
      - dependency-name: "ognl:ognl"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # json-schema-validator 3.x rompe la API de los contract tests (JsonSchemaFactory/SpecVersion);
      # se mantiene en 1.x hasta migrar los tests (ADR-0001 D12: estabilidad sobre novedad).
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencias
      - backend

  # --- Frontend: npm ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      testing:
        patterns:
          - "jest*"
          - "@playwright/*"
          - "@axe-core/*"
    labels:
      - dependencias
      - frontend

  # --- Sitio de ADRs: npm (raíz, log4brains) ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencias
      - docs

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencias
      - ci

  # --- Docker (backend) ---
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencias
      - infra
