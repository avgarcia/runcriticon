# Configuración detekt del backend de Runcriticon.
# Parte de la config por defecto (buildUponDefaultConfig=true en build.gradle.kts)
# y ajusta lo específico del proyecto. Se endurece con el tiempo.

build:
  maxIssues: 0
  excludeCorrectable: false

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    # Los códigos de constantes de enum (p. ej. categorías RGPD de ADR-0014) son identificadores
    # de dominio estables, no números mágicos.
    ignoreEnums: true
  ForbiddenComment:
    active: true
    comments:
      - reason: "Marcar deuda con ticket, no con TODO suelto"
        value: "TODO:"
      - reason: "FIXME debe resolverse antes de merge"
        value: "FIXME:"

complexity:
  LongMethod:
    threshold: 40
  TooManyFunctions:
    active: false  # los @ApplicationService legítimamente agrupan casos de uso

performance:
  SpreadOperator:
    # `runApplication<App>(*args)` es el arranque idiomático de Spring Boot en Kotlin; el spread
    # sobre los args del main no es un problema de rendimiento.
    excludes: ['**/RuncriticonApplication.kt']

naming:
  # Lenguaje ubicuo en castellano (ADR-0008): permitir nombres de dominio en español.
  FunctionNaming:
    functionPattern: '[a-zA-ZáéíóúñÁÉÍÓÚÑ][a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]*'
  VariableNaming:
    variablePattern: '[a-záéíóúñ][a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]*'
    # Los tests usan nombres de propiedad entre acentos graves con espacios (convención de Kotlin
    # para describir reglas ArchUnit / casos); VariableNaming, a diferencia de FunctionNaming, no
    # los ignora. Se excluyen las fuentes de test.
    excludes: ['**/test/**']
  ClassNaming:
    classPattern: '[A-ZÁÉÍÓÚÑ][a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]*'
