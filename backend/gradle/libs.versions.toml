# Version catalog del backend de Runcriticon.
# Fuente única de versiones (Gradle Version Catalog). Referenciado desde build.gradle.kts.
#
# Versiones fijadas a las últimas estables de inicio de 2026. El equipo las actualiza
# a la última estable al primer build (./gradlew dependencyUpdates o revisión manual).
# Cruce: ADR-0001 (Kotlin/Spring Boot), ADR-0007 (Modulith), ADR-0008 (Arrow/Konvert),
# ADR-0010 (test stack), ADR-0016 (GraalVM CE 25, build target 21).

[versions]
kotlin = "2.4.0"
ksp = "2.3.10" # procesador de Konvert (sustituye a kapt). Ligado a la versión de Kotlin.
springBoot = "4.1.0"
springModulith = "2.1.0"
arrow = "2.2.3"
konvert = "4.5.0"
kotest = "6.2.3"
kotestArrow = "2.0.0"
mockk = "1.14.11"
springmockk = "5.0.1"
testcontainers = "2.0.5"
archunit = "1.4.2"
detekt = "2.0.0-alpha.5"
ktlint = "14.2.0"
uuidCreator = "6.1.1"
logstashEncoder = "9.0"
bouncycastle = "1.85"
openapiGenerator = "7.23.0"
bucket4j = "8.19.0" # rate-limiting token-bucket (ADR-0003 D12). jdk17 variant. Backend local Caffeine; migrable a Redis.
jsonSchemaValidator = "1.5.9" # fijado a 1.x: la 3.x rompe la API de los contract tests (JsonSchemaFactory/SpecVersion). ADR-0001 D12.
swaggerRequestValidator = "2.44.9" # contract test REST runtime contra api/openapi.yaml (ADR-0001 D10).
# Micrometer, Flyway, Jackson, Hibernate, etc. los gobierna el BOM de Spring Boot.

[libraries]
# --- Kotlin ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# --- Spring Boot BOM (Gradle nativo, SB4) ---
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- Spring Boot (versiones gobernadas por el BOM) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" } # AuthScopeEnforcementAspect (ADR-0009 D11, LAL-59). Spring Boot 4 renombró spring-boot-starter-aop → spring-boot-starter-aspectj.
spring-session-jdbc = { module = "org.springframework.session:spring-session-jdbc" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# --- Spring Modulith (ADR-0007) ---
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-events-jackson = { module = "org.springframework.modulith:spring-modulith-events-jackson" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# --- Observabilidad (ADR-0011) ---
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

# --- Persistencia (ADR-0004) ---
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# --- Funcional / mapping (ADR-0008) ---
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
konvert-api = { module = "io.mcarle:konvert-api", version.ref = "konvert" }
konvert = { module = "io.mcarle:konvert", version.ref = "konvert" }

# --- Typed IDs UUID v7 (ADR-0008) ---
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# --- Rate limiting (ADR-0003 D12) ---
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" } # token-bucket; jdk17 variant (runtime Graal 25, target 21)
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" } # cache de buckets/contadores en memoria; versión por BOM de Spring Boot

# --- Testing (ADR-0010) ---
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-arrow = { module = "io.kotest.extensions:kotest-assertions-arrow", version.ref = "kotestArrow" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-security-test = { module = "org.springframework.security:spring-security-test" } # versión gobernada por BOM de Spring Boot
# OJO: ognl NO debe actualizarse por su cuenta — su versión la dicta Thymeleaf (3.1.5 → ognl 3.3.x).
# La 3.4.x cambió la firma de OgnlContext y rompe Thymeleaf con NoSuchMethodError. Está ignorada en dependabot.
ognl = { module = "ognl:ognl", version = "3.3.5" } # dialecto estándar de Thymeleaf en el test del renderer (prod usa SpringEL)
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" } # contract test de eventos (ADR-0007 D11)
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" } # serializa Instant (ISO-8601) en el contract test; versión por BOM de Spring Boot
swagger-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swaggerRequestValidator" } # contract test REST runtime vs api/openapi.yaml (ADR-0001 D10)

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
