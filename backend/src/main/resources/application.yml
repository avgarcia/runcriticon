# Configuración base del backend (común a todos los perfiles).
# Los perfiles concretos sobreescriben lo que cambia por entorno (ADR-0013 D1/D2).
# Secretos vía variables de entorno inyectadas por App Runner desde SSM (ADR-0013 D7).

spring:
  application:
    name: runcriticon

  # Spring Modulith: el outbox de eventos persiste en event_publication (ADR-0007 D6).
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # gestionado por migración Flyway propia, no por el framework
      republish-outstanding-events-on-restart: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo gobierna Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # fechas en UTC (ADR-0015 A3)

  # Sesión por cookie respaldada en Postgres (ADR-0003 D10). El schema lo crea Flyway, no el framework.
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  flyway:
    enabled: true
    # Historial único en el schema por defecto; cada módulo aporta su carpeta de migraciones
    # con versiones globalmente ordenadas (persistencia.md §10). El outbox vive en _shared.
    default-schema: public
    locations:
      - classpath:db/migration/_shared
      - classpath:db/migration/identidad
      - classpath:db/migration/club_taxonomia
      - classpath:db/migration/planificacion
      - classpath:db/migration/seguimiento
      - classpath:db/migration/auditoria

# Actuator: health para App Runner (ADR-0006 D3) + métricas Prometheus (ADR-0011 D6).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never   # cuerpo neutro al exterior
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.runcriticon: INFO

server:
  port: 8080
  shutdown: graceful

# Email transaccional vía Postmark (ADR-0005). Secreto desde SSM: /runcriticon/{env}/email/postmark-api-key.
runcriticon:
  email:
    from-address: invitaciones@runcriticon.com
    from-name: Runcriticon
    base-url: https://app.runcriticon.com
    postmark:
      api-key: ${POSTMARK_API_KEY:}
      server-url: https://api.postmarkapp.com
