# Perfil local — desarrollo en máquina del dev (ADR-0013 D13).
# Apunta a la BD y MailHog levantados por docker-compose en la raíz del repo.
# Valores fake con prefijo visible: NUNCA se confunden con producción.
# Prohibido leer SSM real desde local (LocalProfileGuard, ADR-0013 D13).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/runcriticon_local
    username: runcriticon
    password: local-dev-not-prod
  # flyway.locations se heredan de application.yml (las seis carpetas por módulo).

logging:
  level:
    com.runcriticon: DEBUG
    org.springframework.modulith: DEBUG

# Email local vía MailHog (ADR-0005 D14). SMTP en :1025, UI en http://localhost:8025
runcriticon:
  email:
    smtp-host: localhost
    smtp-port: 1025
    postmark:
      api-key: ''          # local usa StubEmailSender (@Profile("local")); no se llama a Postmark
  # Secreto HMAC de tokens: valor fake local con prefijo visible (nunca producción).
  security:
    token-hmac-secret: local-dev-token-hmac-not-prod
  # Salt de hash de userId: valor fake local con prefijo visible (nunca producción).
  observability:
    userid-hash-salt: local-dev-userid-hash-salt-not-prod
  # Semilla del admin (ADR-0003 D3). Solo local: datos fake, nunca producción.
  bootstrap:
    admin-email: admin@runcriticon.local
    admin-password: cambia-esta-password-local
    club-id: 00000000-0000-0000-0000-000000000001
